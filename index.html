{"see": "Quinic Acid Engineering", "pick": "Klebsiella quinic acid dehydrogenase inserted into DHQ-producing E. coli (80 mM Glc → 25 mM Quinic)", "ar": "إنزيم كليبسيلا داخل E. coli بديل للبنزين السام"}, {"see": "β1 / β2 GPCR Cloning in E. coli", "pick": "Human cDNA + lamB outer membrane fusion + ¹²⁵I-iodocyanopindolol (1L=13,000 assays; NO G-proteins!)", "ar": "عرض على السطح عبر lamB وفحص ارتباط فقط لعدم وجود G-protein"}, {"see": "Colony Hybridization vs. Immunoassay", "pick": "Hybridization = Nylon + DNA Probe + Autoradiography | Immunoassay = 1° & 2°-Enzyme Ab + Color reaction", "ar": "التهجين يكشف الـ DNA، والمناعي يكشف البروتين"}, {"see": "Suffix -omab", "pick": "Mouse / Murine (0% human, highest HAMA risk, e.g. Muromonab-CD3)", "ar": "-omab فأر 100% وأعلى تحسس"}, {"see": "Suffix -ximab", "pick": "Chimeric (~65% human + 35% mouse variable regions, e.g. Rituximab, Infliximab)", "ar": "-ximab خيالي 65% بشري"}, {"see": "Suffix -zumab", "pick": "Humanized (>90-95% human framework + mouse CDR loops, e.g. Trastuzumab, Bevacizumab)", "ar": "-zumab مؤنسن 90% بشري"}, {"see": "Suffix -umab", "pick": "Fully Human (100% human, zero mouse protein, e.g. Adalimumab)", "ar": "-umab إنسان 100%"}, {"see": "Substem -tu- vs -li- vs -ci- vs -vi-", "pick": "-tu- = Tumor/Cancer | -li- = Immune/Lymph | -ci- = Circulation/Angiogenesis | -vi- = Virus", "ar": "tu ورم، li مناعة، ci قلب ودورة دموية، vi فيروس"}, {"see": "Rituximab target & indication", "pick": "Binds CD20 on B-cells (ADCC/CDC) → Non-Hodgkin Lymphoma (NHL) & Rheumatoid Arthritis", "ar": "يرتبط بـ CD20 لعلاج أورام الغدد الليمفاوية B والروماتيزم"}, {"see": "Infliximab vs. Adalimumab contrast", "pick": "Both target TNF-α! Infliximab = Chimeric + IV infusion | Adalimumab = Fully Human + SC injection", "ar": "كلاهما ضد TNF-α؛ إنفليكسيماب وريدي وأداليموماب تحت الجلد"}, {"see": "Anti-TNF Safety Warning", "pick": "MANDATORY screening for Latent Tuberculosis (TB) before starting Infliximab or Adalimumab!", "ar": "فحص السل الخامل إجباري قبل أدوية TNF"}, {"see": "Crosses placenta", "pick": "IgG ONLY (passive immunity to newborn; most abundant in blood)", "ar": "IgG فقط يعبر المشيمة"}, {"see": "First antibody in primary response", "pick": "IgM (Pentamer with 10 binding sites; potent complement activator)", "ar": "IgM أول جسم مضاد وهو خماسي"}, {"see": "Trastuzumab (Herceptin) target & indication", "pick": "Binds HER2/neu (ErbB2) receptor → HER2-positive Breast Cancer & Gastric Cancer", "ar": "يستهدف HER2 في سرطان الثدي"}, {"see": "Bevacizumab (Avastin) mechanism", "pick": "Binds VEGF-A → Inhibits Angiogenesis (blood vessel formation feeding tumors) in Colorectal Cancer", "ar": "يعطل VEGF لمنع تكوّن أوعية الدم للورم"}, {"see": "Muromonab-CD3 (OKT3) use", "pick": "Binds CD3 on T-cells → Prevents/Treats Acute Organ Transplant Rejection", "ar": "يرتبط بـ CD3 لمنع رفض الأعضاء المزروعة"}, {"see": "CD4+ vs. CD8+ T-cells (Video 1)", "pick": "CD4+ binds MHC Class II (Helper T-cells) | CD8+ binds MHC Class I (Cytotoxic killer T-cells)", "ar": "CD4 ترتبط بـ MHC II و CD8 ترتبط بـ MHC I"}], "flashcards": [{"m": "m1", "q": "What are the 3 distinct differences between DNA and RNA?", "a": "1) <b>Helix:</b> DNA is double helix; RNA is single helix.<br>2) <b>Sugar:</b> DNA has Deoxyribose (one less O at 2' C); RNA has Ribose.<br>3) <b>Base:</b> DNA has Thymine (T); RNA replaces T with Uracil (U).", "ar": "DNA مزدوج وبداخله T وسكر منقوص الأكسجين، بينما RNA مفرد وبداخله U وسكر رايبوز."}, {"m": "m1", "q": "Distinguish Intra-strand vs. Inter-strand bonding in DNA.", "a": "<b>Intra-strand:</b> Phosphodiester bonds (join nucleotides within one strand's backbone).<br><b>Inter-strand:</b> Hydrogen bonds between complementary bases (A=T has 2, G≡C has 3).", "ar": "داخل نفس السلسلة Phosphodiester، وبين السلسلتين المتقابلتين روابط هيدروجينية."}, {"m": "m1", "q": "Which bases are Purines vs. Pyrimidines?", "a": "<b>Purines (2 rings):</b> Adenine (A) & Guanine (G) — <i>'Pure As Gold'</i>.<br><b>Pyrimidines (1 ring):</b> Cytosine (C), Thymine (T), Uracil (U) — <i>'CUT the Py'</i>.", "ar": "البيورينات حلقتين (A, G) والبيريميدينات حلقة واحدة (C, T, U)."}, {"m": "m1", "q": "Why can't DNA Polymerase III start DNA synthesis on bare single-stranded DNA?", "a": "It CANNOT initiate synthesis from scratch (<i>de novo</i>); it requires a pre-existing strand with a <b>free 3'-OH end</b> provided by an <b>RNA primer</b> (made by RNA primase).", "ar": "لأنه لا يبني من الصفر، بل يشترط وجود طرف 3' حر يوفره الـ RNA primer."}, {"m": "m1", "q": "In which direction does DNA Polymerase III READ the template vs. BUILD the new strand?", "a": "<b>Reads template:</b> 3' → 5' direction.<br><b>Builds new strand:</b> 5' → 3' direction (on BOTH leading and lagging strands!).", "ar": "يقرأ القالب من 3' إلى 5'، ويبني الجديد من 5' إلى 3' دائماً."}, {"m": "m1", "q": "Where does the energy for DNA polymerization come from?", "a": "DNA Pol III brings <b>triphosphate nucleotides (dNTPs)</b>; breaking the high-energy phosphate bond releases the energy needed to polymerize the strand.", "ar": "من كسر الرابطة الفوسفاتية في النيوكليوتيدات ثلاثية الفوسفات."}, {"m": "m1", "q": "How is the Lagging Strand synthesized and sealed?", "a": "Built <b>discontinuously away from the replication fork</b> as <b>Okazaki fragments</b> → a different DNA polymerase (Pol I) replaces RNA primers with DNA → <b>DNA Ligase</b> seals the segments.", "ar": "يبنى بشكل متقطع بعيداً عن الشوكة كقطع أوكازاكي ثم يلحمها Ligase."}, {"m": "m2", "q": "What are Antibodies chemically, and what did Köhler & Milstein achieve in 1975?", "a": "Antibodies (immunoglobulins) are <b>glycoproteins</b> made by B-lymphocytes. In 1975, Köhler & Milstein fused a <b>mouse spleen B-cell</b> with a <b>myeloma cell</b> to create immortal antibody-secreting <b>Hybridomas</b>.", "ar": "بروتينات سكرية من خلايا B؛ عام 1975 تم دمج خلية B طحالية مع خلية Myeloma لإنتاج الـ Hybridoma."}, {"m": "m2", "q": "List the 4 main disadvantages of Monoclonal Antibodies (MABs) vs. Polyclonal Abs.", "a": "1) Cannot distinguish two antigens sharing a <b>common epitope</b>.<br>2) Too specific to cross-react with minor mutant <b>viral strains</b>.<br>3) Lack <b>cooperative binding</b>.<br>4) Cannot form Ab-Ag networks → <b>unlikely to form precipitating complexes</b>.", "ar": "لا تميز المستضدات المشتركة بنفس الـ epitope، تفوت السلالات الفيروسية المتحورة، ولا تكوّن راسب شبكي."}, {"m": "m2", "q": "How does Polyethylene Glycol (PEG, MW 600–6000) fuse B-cells with Myeloma cells?", "a": "Acts as a chemical fusogen by <b>dehydration</b>: removes water molecules from the medium, forcing adjacent cells into intimate membrane contact.", "ar": "يعمل عبر سحب جزيئات الماء (التجفيف) مما يجبر أغشية الخلايا على التلاصق والاندماج."}, {"m": "m2", "q": "Explain 'The HAT Trick' in Hybridoma selection.", "a": "• <b>Unfused B-cells:</b> die rapidly naturally in culture.<br>• <b>Unfused Myeloma cells:</b> engineered so they cannot use HAT medium (<b>Aminopterin</b> kills them).<br>• <b>Hybridomas:</b> ONLY cells that survive & grow!", "ar": "خلايا B تموت طبيعياً، والـ Myeloma يقتلها الـ Aminopterin في وسط HAT، فتعيش الـ Hybridoma فقط."}, {"m": "m2", "q": "Why do many surviving hybridoma clones NOT secrete the desired MAB after HAT selection?", "a": "Early post-fusion cells undergo <b>random sorting and loss of chromosomes</b> (to save energy), so some clones lose the genes coding for the MAB.", "ar": "بسبب الفقدان العشوائي للكروموسومات بعد الاندماج فقد تفقد الجين المسؤول عن الجسم المضاد."}, {"m": "m2", "q": "Compare natural vs. conventional Cryoprotectants (Slide 51).", "a": "• <b>Insects:</b> sugars | <b>Arctic frogs:</b> glucose | <b>Arctic salamanders:</b> glycerol (made in liver).<br>• <b>Conventional lab:</b> Ethylene glycol (antifreeze), Glycerol, and <b>DMSO</b>.", "ar": "الحشرات سكريات، الضفدع جلوكوز، السمندل جليسرول، وبالمختبر DMSO وجليسرول وإيثيلين جلايكول."}, {"m": "m2", "q": "Why is In Vivo MAB production (ascitic fluid in mouse peritoneum) unsuitable for human therapy?", "a": "Causes ethical issues, batch variability, animal death, and <b>contamination</b> (viral/mouse proteins). Mammalian cell culture (up to <b>50,000 L</b>) is used instead despite high cost.", "ar": "بسبب التلوث ومشاكل أخلاقية وتفاوت الإنتاج، لذا نستخدم مزارع الخلايا الثديية للعلاج البشري."}, {"m": "m3", "q": "What are the 3 thermal steps of PCR (temperatures, times & actions)?", "a": "1) <b>Denaturation:</b> 94–95 °C (1 min) — separates DNA strands.<br>2) <b>Annealing:</b> 54–55 °C (45 sec) — forward & reverse primers stick.<br>3) <b>Extension:</b> 72 °C (2 min) — Taq polymerase + dNTPs extend 3' end.<br>(Repeated 20–40 cycles).", "ar": "94 تفكيك (دقيقة)، 54 التصاق البادئات (45 ثانية)، 72 استطالة بإنزيم Taq (دقيقتين)."}, {"m": "m3", "q": "Describe PCR Primers and how they differ from natural replication primers.", "a": "PCR uses <b>forward & reverse artificial DNA strands</b> (usually <b>18–25 bp</b>, ≤50 bp) that determine the exact fragment amplified. Natural replication uses <b>RNA primers</b>!", "ar": "بادئات الـ PCR هي قطع DNA صناعية (18-25 قاعدة)، وليست RNA مثل التضاعف الطبيعي."}, {"m": "m3", "q": "Where does Taq polymerase come from and what is its thermal stability?", "a": "Isolated from <b><i>Thermus aquaticus</i></b> (hot-springs bacterium). Its enzymatic <b>half-life at 95 °C is 40 minutes</b>.", "ar": "من بكتيريا الينابيع الحارة Thermus aquaticus وعمر النصف له عند 95°C هو 40 دقيقة."}, {"m": "m4", "q": "In Transcription, how does mRNA relate to the Bottom vs. Top DNA strand?", "a": "• <b>Bottom strand = Template strand</b> (mRNA is complementary; RNA Pol moves toward its 5' end).<br>• <b>Top strand = Coding strand</b> (mRNA sequence is <b>identical</b> to it, except <b>U replaces T</b>!).", "ar": "السفلى قالب، والعلوية Coding مطابقة تماماً لتسلسل الـ mRNA مع استبدال T بـ U."}, {"m": "m4", "q": "What are the 3 major mRNA processing steps in Eukaryotes (and NOT Prokaryotes)?", "a": "1) <b>Splicing:</b> removes non-coding <b>introns</b>, joins coding <b>exons</b> (before leaving nucleus).<br>2) <b>5' Methylated Guanine Cap:</b> protects RNA + <b>ribosome binding point</b>.<br>3) <b>3' Poly-A Tail:</b> protects against cytoplasmic RNA nucleases.", "ar": "قص الـ Introns، قبعة الغوانين الممثيل في 5' لربط الرايبوسوم، وذيل Poly-A في 3' للحماية."}, {"m": "m4", "q": "Break down the 64 codons of the Genetic Code and define 'Degeneracy'.", "a": "• <b>61 codons</b> specify amino acids (<b>AUG</b> = Met / Start).<br>• <b>3 Stop codons:</b> <b>UAA, UAG, UGA</b>.<br>• <b>Degeneracy:</b> multiple synonymous codons can specify the same amino acid.", "ar": "61 كودون للأحماض الأمينية و3 للتوقف؛ الترادف يعني أن الحمض الواحد قد يملكه أكثر من كودون."}, {"m": "m4", "q": "Describe the 3D shape and two functional ends of tRNA.", "a": "<b>Lumpy L-shape:</b><br>1) <b>Anticodon loop:</b> single-stranded triplet complementary to mRNA codon.<br>2) <b>3'-ACC stem with free -OH group:</b> amino acid attachment site (via <b>aminoacyl-tRNA synthetase</b>).", "ar": "شكل حرف L: طرف فيه Anticodon، والطرف 3'-ACC يحمل مجموعة OH حرة يرتبط بها الحمض الأميني."}, {"m": "m4", "q": "What are the subunits of bacterial ribosomes and the two roles of rRNA?", "a": "Bacterial ribosome = <b>70S</b> overall (<b>30S + 50S</b> subunits).<br><b>rRNA roles:</b> (1) forms overall ribosome structure, (2) <b>aligns mRNA and tRNA</b> via H-bonding.", "ar": "رايبوسوم البكتيريا 70S (من 30S و50S)، والـ rRNA يبني الهيكل ويصطفّ عليه الـ mRNA والـ tRNA."}, {"m": "m4", "q": "In which directions do mRNA reading and polypeptide synthesis occur during Translation?", "a": "Ribosome reads mRNA <b>5' → 3'</b> and joins amino acids from <b>Amino (N) terminus → Carboxyl (C) terminus</b>. Stop codons trigger <b>release factors</b>.", "ar": "قراءة الـ mRNA من 5' إلى 3'، وبناء البروتين من الطرف الأميني N إلى الكربوكسيلي C."}, {"m": "m4", "q": "Match each Post-Translational Modification to its exact Amino Acid(s)!", "a": "• <b>Hydroxylation:</b> Proline<br>• <b>Methylation:</b> Ser, Thr<br>• <b>Phosphorylation:</b> Ser, Thr, Tyr<br>• <b>O-linked glycosylation:</b> Ser, Thr<br>• <b>N-linked glycosylation:</b> Asparagine (Asn)<br>• <b>Acylation:</b> stearic/palmitic fatty acids → Lipoproteins", "ar": "احفظها جيداً: N-linked مع Asn، و O-linked مع Ser/Thr، والفسفرة Ser/Thr/Tyr، والهيدروكسيل Proline."}, {"m": "m4", "q": "Give the lecture examples of (1) Peptide Backbone Cleavage and (2) Prosthetic Group.", "a": "1) <b>Backbone cleavage:</b> <b>Insulin</b> maturation (signal peptide cleaved in ER → protease removes <b>C-peptide</b> + Carboxypeptidase E → mature insulin).<br>2) <b>Prosthetic group:</b> <b>Heme</b> = iron (Fe) in a <b>porphyrin</b> ring (e.g., Hemoglobin).", "ar": "قص السلسلة كما في نضج الإنسولين وإزالة C-peptide، والمجموعة المرافقة مثل الهيم (حديد بحلقة بورفيرين)."}, {"m": "m5", "q": "List the key physical properties of Plasmids.", "a": "Extrachromosomal, <b>circular, always dsDNA, supercoiled</b>, autonomous replication via a <b>replicon</b>; <b>1–1000 kbp</b> (0.1%–10% of host chromosome, small ≤30 genes); 1 to dozens of copies/cell.", "ar": "حلقي، مزدوج السلسلة دائماً، ملتف Supercoiled، مستقل التضاعف، حجمه 1 إلى 1000 كيلو قاعدة."}, {"m": "m5", "q": "Distinguish R-factors, Bacteriocins, and Virulence Plasmids.", "a": "• <b>R factors:</b> antibiotic resistance enzymes.<br>• <b>Bacteriocins:</b> proteins toxic to other bacteria lacking the same plasmid.<br>• <b>Virulence plasmids:</b> toxins harming humans (e.g., <i>S. aureus</i> coagulase, hemolysin, enterotoxin).", "ar": "R لمقاومة المضادات، Bacteriocins لقتل بكتيريا منافسة، Virulence لسموم تضر الإنسان."}, {"m": "m5", "q": "Classify Restriction Enzymes by cut end: 5' sticky vs. 3' sticky vs. Blunt (Slide 109).", "a": "• <b>5'-phosphate overhang:</b> EcoRI, BamHI, Sau3AI, NotI.<br>• <b>3'-hydroxyl overhang:</b> <b>PstI</b>.<br>• <b>Blunt end:</b> <b>PvuII, HpaI, HaeIII</b>.", "ar": "PstI يعطي طرف 3'، و PvuII/HpaI/HaeIII أطراف ملساء Blunt، والبقية أطراف 5'."}, {"m": "m5", "q": "Compare Viral Vectors vs. Plasmid Vectors for inserting DNA into host cells.", "a": "• <b>Viral vectors:</b> DNA packaged into infectious virus particles → enters via <b>infection</b> (fairly efficient).<br>• <b>Plasmids:</b> require <b>transfection/transformation</b> (chemical & enzymatic treatment to permeabilize cell membrane).", "ar": "الفيروسات تدخل بالعدوى بكفاءة عالية، أما البلازميد فيحتاج معالجة كيميائية/إنزيمية لجعل الغشاء منفذاً."}, {"m": "m5", "q": "Compare Bacteria, Yeast, and Mammalian (CHO) cloning hosts.", "a": "• <b>Bacteria:</b> fast (20–90m), cheap, NO glycosylation/secretion/intron splicing.<br>• <b>Yeast:</b> fast, cheap, secretes & glycosylates (but variable/non-human sugars, lower yield).<br>• <b>Mammalian (CHO):</b> slow (18–24h), fragile/costly, PROPER splicing, cleavage, human glycosylation & refolding!", "ar": "البكتيريا سريعة بلا سكر، الخميرة تضيف سكر مختلف، والخلايا الثديية CHO بطيئة لكن تعطي بروتين بشري متكامل."}, {"m": "m5", "q": "Why use the Fused Gene Method (e.g., β-galactosidase) and how do you cleave the product?", "a": "Fusing to <b><i>lacZ</i> (β-gal)</b> gives strong promoter expression and <b>stabilizes, protects & marks</b> small foreign peptides. After purification, <b>CNBr (cyanogen bromide)</b> cleaves specifically at <b>Methionine (Met)</b>!", "ar": "الدمج مع بيتا-جالاكتوسيداز يحمي الببتيد الصغير ويزيد إنتاجه، ثم نفصله بمادة CNBr عند الميثيونين."}, {"m": "m5", "q": "Case A: What 4 design features enabled cloning of 14-aa Human Somatostatin in E. coli?", "a": "1) Fused to <b><i>lacZ</i> (β-gal)</b> gene.<br>2) <b>Two stop codons</b> placed after C-terminal Cys.<br>3) <b>Met codon</b> placed before N-terminal Ala (for <b>CNBr</b> cleavage; 0 internal Met!).<br>4) <b>EcoRI & BamHI</b> sticky-end linkers.", "ar": "دمج مع lacZ + كودونين توقف + كودون Met قبل Ala للقص بـ CNBr + أطراف EcoRI و BamHI."}, {"m": "m5", "q": "Case B: How was E. coli engineered to produce Quinic Acid, and why?", "a": "Replaces scarce cinchona bark & toxic/costly petroleum benzene (for making <b>hydroquinone & benzoquinone</b>). <i>E. coli</i> engineered to overproduce <b>DHQ</b> + given <b><i>Klebsiella pneumoniae</i> quinic acid dehydrogenase</b> → <b>80 mM glucose → 25 mM quinic acid</b>.", "ar": "إدخال إنزيم من Klebsiella إلى E. coli لتحويل الجلوكوز إلى حمض الكينيك بدل البنزين البترولي السام."}, {"m": "m5", "q": "Case C: How are human β1 & β2 receptors cloned in E. coli, and what is the key limitation?", "a": "Isolated from <b>human cDNA library</b> & fused to <b><i>lamB</i></b> (outer-membrane maltose transporter) → expressed on bacterial outer surface; verified by <b>¹²⁵I-iodocyanopindolol</b> (1 L = 13,000 assays). <b>Limitation:</b> Bacteria <b>lack G-proteins</b>, so functional responses CANNOT be measured!", "ar": "دمج cDNA مع جين lamB ليظهر المستقبل على سطح البكتيريا؛ يصلح لفحص الارتباط فقط لعدم وجود G-proteins."}, {"m": "m5", "q": "How does Colony Hybridization differ from Immunological Screening?", "a": "• <b>Colony Hybridization:</b> detects <b>DNA</b> on nylon membrane using a radioactive <b>nucleic acid probe + autoradiography</b>.<br>• <b>Immunological Assay:</b> detects expressed <b>PROTEIN</b> using <b>Primary Ab + Enzyme-linked Secondary Ab + color reaction</b>, then subculturing from master plate.", "ar": "التهجين يكشف وجود الجين بالـ Autoradiography، بينما الفحص المناعي يكشف البروتين المصنّع بتفاعل لوني."}, {"m": "m2", "q": "From where was the rat myeloma (plasmacytoma) cell line derived (Slide 43)?", "a": "Rat plasmacytoma derived from the <b>ileocecal lymph nodes of rats</b>.", "ar": "معلومة دقيقة من سلايد 43: مشتقة من العقد اللمفاوية اللفائفية الأعورية (ileocecal lymph nodes) في الجرذان."}, {"m": "m6", "q": "What do the suffixes -omab, -ximab, -zumab, and -umab indicate about antibody composition?", "a": "• <b>-omab:</b> Mouse / Murine (0% human, highest HAMA risk).<br>• <b>-ximab:</b> Chimeric (~65% human, 35% mouse variable regions).<br>• <b>-zumab:</b> Humanized (>90–95% human, only CDR mouse).<br>• <b>-umab:</b> Fully Human (100% human, zero mouse protein).", "ar": "omab فار، ximab ميكس 65%، zumab أنسنة 90%، umab إنسان 100%."}, {"m": "m6", "q": "What target do the substems -tu-, -li-, -ci-, and -vi- represent in mAb names?", "a": "• <b>-tu(m)-:</b> Tumor / Cancer (e.g. Trastuzumab, Rituximab).<br>• <b>-li(m)-:</b> Immune / Lymph (e.g. Adalimumab, Infliximab).<br>• <b>-ci(r)-:</b> Circulation / Blood vessels (e.g. Bevacizumab, Abciximab).<br>• <b>-vi(r)-:</b> Virus (e.g. Palivizumab).", "ar": "tu ورم، li مناعة وروماتيزم، ci دورة دموية وقلب، vi فيروس."}, {"m": "m6", "q": "What are the 3 main mechanisms by which therapeutic monoclonal antibodies work (Video 2)?", "a": "1) <b>Neutralisation:</b> binding soluble cytokines (TNF-α) or growth factors (VEGF).<br>2) <b>Receptor Blockade:</b> blocking surface receptors (HER2, EGFR).<br>3) <b>Targeted Cell Destruction:</b> flagging cells for ADCC (NK cells) and CDC (complement) (e.g. anti-CD20).", "ar": "معادلة السيتوكينات، حجب المستقبلات، أو وسم الخلية ليدمرها جهاز المناعة."}, {"m": "m6", "q": "Compare Infliximab and Adalimumab (Target, Type, and Route of Administration).", "a": "• <b>Target (Both):</b> TNF-alpha (pro-inflammatory cytokine).<br>• <b>Infliximab:</b> Chimeric (<code>-ximab</code>, ~65% human) administered via <b>Intravenous (IV) Infusion</b>.<br>• <b>Adalimumab:</b> Fully Human (<code>-umab</code>, 100% human) administered via <b>Subcutaneous (SC) Injection</b>.<br>• <b>Indications:</b> Crohn's, Ulcerative Colitis, Rheumatoid Arthritis, Psoriasis.", "ar": "كلاهما ضد TNF-alpha؛ Infliximab خيالي ويعطى وريدياً IV، و Adalimumab إنساني كامل ويعطى تحت الجلد SC."}, {"m": "m6", "q": "What is the target, mechanism, and clinical indication of Rituximab (Rituxan)?", "a": "• <b>Type:</b> Chimeric (<code>-ximab</code>).<br>• <b>Target:</b> <b>CD20</b> antigen on B-lymphocytes.<br>• <b>Mechanism:</b> Tags B-cells for immune destruction via ADCC & complement (CDC).<br>• <b>Indications:</b> Non-Hodgkin Lymphoma (NHL), Chronic Lymphocytic Leukemia (CLL), Rheumatoid Arthritis.", "ar": "دواء خيالي يرتبط بـ CD20 على خلايا B ليدمرها في سرطان الغدد الليمفاوية والروماتيزم."}, {"m": "m6", "q": "What is the target and clinical indication of Trastuzumab (Herceptin)?", "a": "• <b>Type:</b> Humanized (<code>-zumab</code>).<br>• <b>Target:</b> <b>HER2/neu</b> (ErbB2) receptor.<br>• <b>Mechanism:</b> Blocks HER2 cell signaling & recruits immune ADCC.<br>• <b>Indication:</b> <b>HER2-positive Breast Cancer</b> & metastatic gastric cancer.", "ar": "دواء مؤنسن يرتبط بمستقبل HER2 لعلاج سرطان الثدي الإيجابي لـ HER2 وسرطان المعدة."}, {"m": "m6", "q": "What is the mechanism and clinical use of Bevacizumab (Avastin) vs. Ranibizumab (Lucentis)?", "a": "• <b>Target:</b> <b>VEGF-A</b> (Vascular Endothelial Growth Factor).<br>• <b>Mechanism:</b> <b>Inhibits Angiogenesis</b> (starves tumors / stops retinal neovascularization).<br>• <b>Bevacizumab:</b> Used for <b>Colorectal cancer</b> & lung cancer.<br>• <b>Ranibizumab:</b> Fab fragment used intraocularly for <b>Wet Age-Related Macular Degeneration (AMD)</b>.", "ar": "كلاهما ضد VEGF لمنع تكوّن أوعية دموية جديدة: Bevacizumab لسرطان القولون، و Ranibizumab لشبكية العين AMD."}, {"m": "m6", "q": "What is Muromonab-CD3 (OKT3) and what is its clinical application?", "a": "• <b>Type:</b> 100% Mouse / Murine (<code>-omab</code>).<br>• <b>Target:</b> <b>CD3</b> on mature T-lymphocytes.<br>• <b>Mechanism:</b> Blocks T-cell receptor activation and clears T-cells.<br>• <b>Indication:</b> <b>Prevention & treatment of Acute Organ Transplant Rejection</b> (renal, cardiac, hepatic allografts).", "ar": "دواء فأري 100% يرتبط بـ CD3 على خلايا T لمنع رفض الأعضاء المزروعة."}, {"m": "m6", "q": "What are the targets and indications of Omalizumab and Abciximab?", "a": "• <b>Omalizumab (Xolair):</b> Humanized (<code>-zumab</code>) targeting <b>IgE</b> → <b>Severe Allergic Asthma</b>.<br>• <b>Abciximab (ReoPro):</b> Chimeric Fab (<code>-ximab</code>) targeting <b>Platelet GP IIb/IIIa</b> → inhibits platelet aggregation in <b>PCI (Angioplasty)</b> to prevent thrombosis.", "ar": "Omalizumab ضد IgE للربو التحسسي، و Abciximab ضد صفائح GP IIb/IIIa لمنع جلطات القسطرة القلبية."}, {"m": "m6", "q": "Distinguish Fab vs. Fc fragments of an antibody and their biological functions.", "a": "• <b>Fab (Fragment antigen-binding):</b> Variable region + CDR loops that bind specific antigens.<br>• <b>Fc (Fragment crystallizable / Constant):</b> Stem that dictates isotype (IgG/IgM/etc.), activates <b>complement (C1q)</b>, and binds <b>Fc receptors</b> on macrophages & NK cells (mediates ADCC).", "ar": "الـ Fab هو الذراع للارتباط بالأنتيجين، والـ Fc هو الجذع الثابت لتفعيل المتمم وخلايا المناعة."}, {"m": "m6", "q": "Summarize the 5 Immunoglobulin Isotypes (GAMED) and their key exam facts.", "a": "• <b>IgG:</b> Monomer, most abundant (~80%), <b>ONLY antibody crossing the placenta</b>, secondary response.<br>• <b>IgA:</b> Dimer, <b>mucosal secretions & breast milk</b>.<br>• <b>IgM:</b> <b>Pentamer</b> (10 binding sites), <b>FIRST produced in primary response</b>.<br>• <b>IgE:</b> Monomer, binds mast cells/basophils → <b>allergies (histamine) & parasites</b>.<br>• <b>IgD:</b> B-cell surface receptor.", "ar": "IgG يعبر المشيمة، IgM أول الأجسام المضادة وخماسي، IgA في الإفرازات المخاطية والحليب، IgE للحساسية والديدان، IgD مستقبل."}, {"m": "m6", "q": "Why MUST patients be screened for Latent Tuberculosis (TB) before starting Infliximab or Adalimumab?", "a": "<b>TNF-alpha</b> is essential to maintain <b>granulomas</b> that keep <i>M. tuberculosis</i> walled off and dormant. Blocking TNF-alpha breaks down granulomas, causing catastrophic <b>TB reactivation</b>!", "ar": "لأن TNF-alpha يحافظ على الحبيبات الدرنية التي تحبس بكتيريا السل الخاملة، وحجبه ينشط السل فجأة!"}], "quiz": [{"m": "m1", "q": "Which structural feature specifically distinguishes DNA's pentose sugar from RNA's pentose sugar?", "opts": ["DNA has an extra hydroxyl group on the 5' carbon", "DNA replaces the sugar-phosphate backbone with peptide linkages", "DNA contains a 6-carbon hexose ring numbered counterclockwise", "DNA lacks an oxygen atom on the 2' carbon of the 5-carbon sugar"], "ans": 3, "exp": "Deoxyribose has one less oxygen (specifically at the 2' carbon) compared to ribose; carbons are numbered 1' to 5' clockwise.", "ar": "سكر الـ DNA منقوص الأكسجين على ذرة الكربون 2' مقارنة بالـ RNA.", "isPast": false, "isExpected": false}, {"m": "m1", "q": "Within a single DNA strand, adjacent nucleotides are joined by _______ bonds, whereas the two complementary strands are held together by _______ bonds.", "opts": ["Phosphodiester; hydrogen", "Peptide; ionic", "Hydrogen; phosphodiester", "Disulfide; phosphodiester"], "ans": 0, "exp": "Intra-strand bonding uses covalent phosphodiester bonds (backbone), while inter-strand bonding uses hydrogen bonds between complementary bases (A=T, G≡C).", "ar": "داخل نفس السلسلة روابط Phosphodiester، وبين السلسلتين روابط Hydrogen.", "isPast": false, "isExpected": false}, {"m": "m1", "q": "Which pairing correctly identifies Purines vs. Pyrimidines and the number of hydrogen bonds in DNA?", "opts": ["Purines (A, T) form 3 H-bonds; Pyrimidines (G, C) form 2 H-bonds", "Purines (A, G) pair with Pyrimidines (T, C) via 2 H-bonds (A=T) and 3 H-bonds (G≡C)", "All base pairs in DNA are joined by exactly 2 hydrogen bonds", "Purines (C, T) pair with Pyrimidines (A, G) via 3 H-bonds (A≡T) and 2 H-bonds (G=C)"], "ans": 1, "exp": "Adenine & Guanine are 2-ring purines; Thymine & Cytosine are 1-ring pyrimidines. A bonds only with T (2 H-bonds) and G bonds only with C (3 H-bonds).", "ar": "البيورينات A و G، والبيريميدينات T و C؛ A=T رابطتين و G≡C ثلاث روابط.", "isPast": false, "isExpected": false}, {"m": "m1", "q": "During DNA replication, why is RNA primase essential before DNA Polymerase III can act?", "opts": ["DNA Polymerase III can only read the parental template in the 5' to 3' direction", "RNA primase joins Okazaki fragments together on the leading strand", "RNA primase breaks hydrogen bonds to create the replication fork", "DNA Polymerase III cannot start a new strand from scratch and requires a free 3' end"], "ans": 3, "exp": "DNA Pol III cannot initiate synthesis de novo; RNA primase lays down a short RNA primer providing a free 3'-OH end.", "ar": "لأن DNA Pol III لا يبني من الصفر ويحتاج طرف 3' حر يوفره الـ RNA primer.", "isPast": false, "isExpected": false}, {"m": "m1", "q": "Which statement accurately describes DNA Polymerase III directionality and the lagging strand?", "opts": ["It reads template 5'→3' and builds the lagging strand 3'→5' continuously", "It reads template 3'→5' and builds BOTH strands 5'→3', forming discontinuous Okazaki fragments away from the fork on the lagging strand", "It builds the leading strand 5'→3' and the lagging strand 3'→5' toward the fork", "Single-strand binding proteins (SSBs) replace RNA primers with DNA on Okazaki fragments"], "ans": 1, "exp": "DNA Pol III ALWAYS reads the parental strand 3'→5' and synthesizes new DNA 5'→3'. On the lagging strand, synthesis moves away from the fork in discontinuous Okazaki fragments.", "ar": "دائماً القراءة 3'→5' والبناء 5'→3'، والسلسلة المتأخرة تبنى كقطع أوكازاكي بعيداً عن الشوكة.", "isPast": false, "isExpected": false}, {"m": "m1", "q": "In the final steps of lagging strand replication, which two enzymes replace the RNA primers and seal the DNA segments, respectively?", "opts": ["Helicase and RNA primase", "SSBs and Taq polymerase", "RNA polymerase and restriction endonuclease", "A different DNA polymerase (Pol I) and DNA ligase"], "ans": 3, "exp": "A different DNA polymerase (DNA Pol I) replaces RNA primer nucleotides with DNA, and DNA ligase joins the DNA segments together.", "ar": "إنزيم DNA polymerase آخر يستبدل الـ RNA بـ DNA، ثم يلحم DNA ligase القطع معاً.", "isPast": false, "isExpected": false}, {"m": "m2", "q": "In 1975, Köhler and Milstein produced hybridoma cells by fusing which two cell types?", "opts": ["Human T-lymphocytes and E. coli cells", "Chinese hamster ovary (CHO) cells and yeast cells", "Antibody-producing mouse spleen B-lymphocytes and immortal myeloma cells", "Bone marrow erythrocytes and Sendai virus particles"], "ans": 2, "exp": "Hybridomas combine the antibody secretion of spleen B-lymphocytes with the immortality of myeloma cells.", "ar": "دمج خلايا B المنتجة للأجسام المضادة من طحال الفأر مع خلايا Myeloma الخالدة.", "isPast": false, "isExpected": false}, {"m": "m2", "q": "Which of the following is a TRUE disadvantage of Monoclonal Antibodies (MABs) compared to Polyclonal Antibodies?", "opts": ["MABs cannot form precipitating Ab-Ag networks and may fail to cross-react with minor viral strain variants", "MABs readily form large precipitating antigen-antibody networks", "MABs cannot be produced in large quantities under controlled conditions", "MABs always bind cooperatively to multiple different epitopes on an antigen"], "ans": 0, "exp": "Unlike polyclonal Abs, MABs bind a single epitope—so they lack cooperative binding, cannot form precipitating networks, cannot distinguish two antigens sharing that epitope, and may miss minor viral mutants.", "ar": "الـ MABs لا تكوّن شبكات ترسيب وقد لا تتعرف على السلالات الفيروسية المتحورة لشدة تخصصها.", "isPast": false, "isExpected": false}, {"m": "m2", "q": "How does Polyethylene Glycol (PEG, MW 600–6000) promote cell fusion during hybridoma generation?", "opts": ["By blocking de novo purine synthesis via aminopterin", "By dehydration—removing water molecules from the medium and forcing cells into intimate contact", "By applying microsecond high-voltage electrical pulses to create pores", "By inserting viral envelope glycoproteins into the nucleus"], "ans": 1, "exp": "PEG (MW 600–6000) is a chemical fusogen that works by dehydration, removing water and pushing cell membranes together.", "ar": "يعمل الـ PEG عن طريق سحب الماء (Dehydration) لإجبار أغشية الخلايا على التلاصق.", "isPast": false, "isExpected": false}, {"m": "m2", "q": "During 'The HAT Trick' selection after fusion, what happens to unfused B-cells and unfused myeloma cells?", "opts": ["Both unfused B-cells and hybridomas die, leaving pure myeloma clones", "PEG selectively lyses unfused B-cells while sparing myeloma cells", "Unfused B-cells die naturally in culture; unfused engineered myeloma cells cannot use HAT medium and die", "Unfused B-cells are killed by aminopterin; unfused myeloma cells survive indefinitely"], "ans": 2, "exp": "Normal B-cells die rapidly in culture on their own, while genetically engineered myeloma cells are killed in HAT medium (aminopterin). Only fused B-myeloma hybridomas survive.", "ar": "خلايا B تموت طبيعياً لقصر عمرها، وخلايا الـ Myeloma تموت في وسط HAT، فلا يعيش إلا الـ Hybridoma.", "isPast": false, "isExpected": false}, {"m": "m2", "q": "Why must surviving hybridoma clones still be screened (e.g., via ELISA of culture supernatant) after HAT selection?", "opts": ["Because antibodies remain trapped inside the nucleus and are never secreted into supernatant", "Because early post-fusion cells undergo random chromosome sorting and loss, so many lose functional MAB genes", "Because unfused myeloma cells rapidly mutate to secrete polyclonal antibodies", "Because HAT medium destroys the antigen-binding site of immunoglobulins"], "ans": 1, "exp": "Post-fusion hybridomas randomly lose chromosomes to conserve energy, so a high proportion of clones do not secrete the desired antibody.", "ar": "لأن الخلايا المندمجة تفقد بعض الكروموسومات عشوائياً بالبداية فقد تخسر جين الجسم المضاد المطلوب.", "isPast": false, "isExpected": false}, {"m": "m2", "q": "According to your lecture slides on Cryoprotectants, which pairing of organism/use and cryoprotectant is CORRECT?", "opts": ["Arctic frogs use DMSO; Arctic salamanders use ethylene glycol", "Arctic frogs use glucose; Arctic salamanders synthesize glycerol in their livers", "Insects use aminopterin; Conventional labs use sucrose only", "Arctic salamanders use CNBr; Arctic frogs use PEG 6000"], "ans": 1, "exp": "Slide 51: Insects use sugars, Arctic frogs use glucose, Arctic salamanders make glycerol in their livers; conventional lab cryoprotectants are ethylene glycol, glycerol, and DMSO.", "ar": "الضفدع القطبي يستخدم الجلوكوز، والسمندل القطبي يصنع الجليسرول في كبده!", "isPast": false, "isExpected": false}, {"m": "m2", "q": "Why is In Vivo MAB production in mouse peritoneum (ascitic fluid) rejected for human therapeutic antibodies?", "opts": ["Mammalian bioreactors cannot exceed 5 liters in volume", "Hybridoma cells cannot divide inside the peritoneal cavity", "Ethical concerns, variability, animal death, and contamination make it unsuitable for therapy", "Ascitic fluid degrades glycoproteins via Taq polymerase"], "ans": 2, "exp": "In vivo ascitic production suffers from ethical issues, contamination, animal death, and variability, making it unsuitable for human therapeutics (whereas mammalian culture scales to 50,000 L).", "ar": "الإنتاج داخل تجويف البطن للفئران ملوث وغير أخلاقي ولا يصلح للعلاج البشري.", "isPast": false, "isExpected": false}, {"m": "m3", "q": "Which sequence gives the exact order, temperatures, and durations of the 3 PCR steps shown in your lecture?", "opts": ["Extension (94°C) → Ligation (55°C) → Splicing (72°C)", "Annealing (94°C, 2 min) → Denaturation (54°C, 1 min) → Extension (72°C, 45 sec)", "Denaturation (94–95°C, 1 min) → Annealing (54–55°C, 45 sec) → Extension (72°C, 2 min)", "Denaturation (72°C, 1 min) → Annealing (37°C, 2 min) → Extension (95°C, 45 sec)"], "ans": 2, "exp": "Step 1: Denaturation (~94–95°C, 1 min) separates strands; Step 2: Annealing (~54–55°C, 45 s) binds forward & reverse primers; Step 3: Extension (72°C, 2 min) synthesizes DNA with dNTPs + Taq.", "ar": "الترتيب الصحيح: 94 تفكيك (دقيقة) ← 54 التصاق البادئات (45 ثانية) ← 72 استطالة (دقيقتين).", "isPast": false, "isExpected": false}, {"m": "m3", "q": "Which statement about PCR Primers and Taq Polymerase is CORRECT?", "opts": ["PCR primers are short artificial DNA strands (usually 18–25 bp); Taq polymerase from Thermus aquaticus has a 40-min half-life at 95°C", "Taq polymerase was isolated from Klebsiella pneumoniae and functions best at 37°C", "PCR requires only a single forward primer and DNA ligase to amplify a specific gene", "PCR primers are 200-bp RNA strands; Taq polymerase is denatured permanently in 1 minute at 95°C"], "ans": 0, "exp": "PCR primers are artificial DNA oligonucleotides (18–25 bp, not >50 bp) defining the target boundaries. Taq polymerase (from hot-spring bacterium Thermus aquaticus) has t½ = 40 min at 95°C.", "ar": "بادئات الـ PCR هي DNA صناعي (18-25 قاعدة)، وإنزيم Taq عمر النصف له 40 دقيقة عند 95°C.", "isPast": false, "isExpected": false}, {"m": "m3", "q": "Who conceived the Polymerase Chain Reaction (PCR) in 1985, earning the Nobel Prize in Chemistry?", "opts": ["Watson and Crick", "Köhler and Milstein", "Frederick Sanger", "Kary Mullis"], "ans": 3, "exp": "Kary Mullis conceived PCR in 1985 while driving on the California freeways (Köhler & Milstein developed hybridoma MABs in 1975).", "ar": "مخترع الـ PCR عام 1985 هو Kary Mullis.", "isPast": false, "isExpected": false}, {"m": "m4", "q": "By convention in Transcription, if the top ('coding') DNA strand is 5'-ATG-CGT-TCA-3', what is the corresponding mRNA sequence?", "opts": ["5'-UAC-GCA-AGU-3'", "5'-AUG-CGU-UCA-3'", "5'-ATG-CGT-TCA-3'", "3'-AUG-CGU-UCA-5'"], "ans": 1, "exp": "Bottom strand is the template; mRNA is complementary to the bottom strand and therefore IDENTICAL in sequence/polarity to the top coding strand, except Uracil (U) replaces Thymine (T)!", "ar": "الـ mRNA مطابق تماماً للسلسلة العلوية (Coding strand) مع استبدال كل T بحرف U!", "isPast": false, "isExpected": false}, {"m": "m4", "q": "Which mRNA processing event occurs in Eukaryotes BEFORE leaving the nucleus and serves as a binding point for the ribosome?", "opts": ["Addition of a 3' polyadenylic acid (Poly-A) tail", "Insertion of intervening non-coding introns", "Cleavage by cyanogen bromide (CNBr)", "Addition of a 5' methylated guanine cap"], "ans": 3, "exp": "The 5' methylated guanine cap both protects mRNA from degradation and serves as the ribosome binding point. The 3' Poly-A tail protects against RNA nucleases outside the nucleus; splicing removes introns.", "ar": "قبعة الـ Methylated Guanine على الطرف 5' تحمي الـ mRNA وتعمل كنقطة ارتباط للرايبوسوم.", "isPast": false, "isExpected": false}, {"m": "m4", "q": "How many total triplet codons exist in the Genetic Code, and how are they distributed?", "opts": ["64 codons (4³): 61 specify amino acids and 3 are stop codons (UAA, UAG, UGA)", "20 codons: 19 for amino acids and 1 stop codon", "64 codons: 60 specify amino acids and 4 are start codons", "48 codons: all 48 code for multiple different amino acids simultaneously"], "ans": 0, "exp": "4³ = 64 codons: 61 sense codons (AUG = Met/Start) and 3 termination/stop codons (UAA, UAG, UGA). 'Degeneracy' means multiple synonymous codons can code for one amino acid, though each codon specifies ONLY one amino acid.", "ar": "64 كودون (61 للأحماض الأمينية + 3 كودونات توقف UAA, UAG, UGA).", "isPast": false, "isExpected": false}, {"m": "m4", "q": "Where does an amino acid attach on a tRNA molecule, and which enzyme catalyzes this activation?", "opts": ["At the 3'-ACC stem free hydroxyl (-OH) group via a specific aminoacyl-tRNA synthetase", "At the anticodon loop via RNA polymerase", "At the 5' methylated guanine cap via peptidyl transferase", "At the 30S ribosomal subunit via DNA ligase"], "ans": 0, "exp": "tRNA has a lumpy L-shape with an anticodon loop at one end and a 3'-ACC stem bearing a free -OH group at the other end, where a unique aminoacyl-tRNA synthetase activates and attaches the amino acid.", "ar": "يرتبط الحمض الأميني بمجموعة الـ OH الحرة على الطرف 3'-ACC بواسطة إنزيم aminoacyl-tRNA synthetase.", "isPast": false, "isExpected": false}, {"m": "m4", "q": "During the Elongation stage of bacterial translation (on the 70S ribosome made of 30S + 50S subunits), what are the exact directions of mRNA reading and peptide assembly?", "opts": ["mRNA read 3'→5'; protein built C-terminus to N-terminus", "mRNA read randomly; release factors join amino acids until AUG is reached", "mRNA read 5'→3'; protein built from carboxyl (C) terminus to amino (N) terminus", "mRNA read 5'→3'; protein built from amino (N) terminus to carboxyl (C) terminus"], "ans": 3, "exp": "The ribosome reads mRNA from 5' to 3' and joins activated amino acids step-by-step from the amino (N) terminus to the carboxyl (C) terminus.", "ar": "قراءة الـ mRNA من 5' إلى 3' وبناء البروتين من الطرف الأميني (N) إلى الكربوكسيلي (C).", "isPast": false, "isExpected": false}, {"m": "m4", "q": "Which post-translational side-chain modification is INCORRECTLY matched with its target amino acid(s)?", "opts": ["O-linked glycosylation → Serine and Threonine", "Phosphorylation → Serine, Threonine, Tyrosine", "N-linked glycosylation → Proline and Glycine", "Hydroxylation → Proline (to hydroxyproline)"], "ans": 2, "exp": "N-linked carbohydrate attachment occurs on Asparagine (Asn), whereas O-linked occurs on Serine and Threonine! Acylation attaches fatty acids (stearic, palmitic) to form lipoproteins.", "ar": "الارتباط السكري N-linked يحدث على الحمض الأميني Asparagine (Asn) وليس البرولين!", "isPast": false, "isExpected": false}, {"m": "m4", "q": "What is a 'Heme' prosthetic group (as found in Hemoglobin), and how is Mature Insulin formed?", "opts": ["Heme is an iron atom inside a porphyrin ring; Mature insulin is formed via peptide backbone cleavage (removing signal peptide & C-peptide)", "Heme is zinc in thymine; Insulin is cleaved by CNBr in human beta cells", "Heme is magnesium in ribose; Insulin is formed by phosphorylating C-peptide", "Heme is copper in stearic acid; Insulin is synthesized without cleavage in bacteria"], "ans": 0, "exp": "Heme consists of an iron (Fe) atom in the center of a heterocyclic porphyrin ring. Insulin undergoes ER signal peptide cleavage + secretory vesicle protease cleavage liberating C-peptide + Carboxypeptidase E trimming.", "ar": "الهيم ذرة حديد داخل حلقة بورفيرين، والإنسولين ينضج بقص السلسلة الببتيدية وإزالة C-peptide.", "isPast": false, "isExpected": false}, {"m": "m5", "q": "Which set of properties accurately characterizes bacterial Plasmids?", "opts": ["Membrane glycoproteins larger than the entire bacterial chromosome", "Circular, supercoiled, double-stranded DNA molecules (1–1,000 kbp) capable of autonomous replication via a replicon", "Single-stranded DNA viruses that cannot carry antibiotic resistance genes", "Linear single-stranded RNA molecules dependent on host mitosis without an origin"], "ans": 1, "exp": "Plasmids are circular, always dsDNA, supercoiled, 1–1000 kbp (0.1%–10% of host chromosome), carry a replicon regulating copy number (1 to dozens), and add traits like R-factors (antibiotic resistance) or bacteriocins.", "ar": "البلازميد حلقي، مزدوج السلسلة دائماً، ملتف، حجمه 1-1000 kbp ويتضاعف ذاتياً عبر الـ Replicon.", "isPast": false, "isExpected": false}, {"m": "m5", "q": "On natural plasmids, what is the difference between 'R factors' and 'Bacteriocins'?", "opts": ["R factors degrade hydrocarbons; Bacteriocins detoxify heavy metals", "R factors carry antibiotic resistance genes; Bacteriocins are proteins toxic to other bacteria lacking the same plasmid", "R factors are restriction enzymes; Bacteriocins are human coagulase toxins", "R factors are ribosomal RNAs; Bacteriocins are antifungal sugars"], "ans": 1, "exp": "Plasmids carrying antibiotic-modifying/degrading enzymes are called R factors; bacteriocins kill competing bacteria lacking that plasmid; virulence plasmids encode host toxins (coagulase, hemolysin, enterotoxin).", "ar": "عوامل R تعطي مقاومة للمضادات الحيوية، والـ Bacteriocins تقتل البكتيريا الأخرى المنافسة.", "isPast": false, "isExpected": false}, {"m": "m5", "q": "How does a Restriction Endonuclease cut DNA?", "opts": ["Breaks hydrogen bonds between bases while leaving the sugar-phosphate backbone intact", "Makes two incisions—one through each sugar-phosphate backbone of dsDNA—without damaging nitrogenous bases", "Degrades mRNA from the 3' Poly-A tail inward", "Cleaves peptide bonds specifically at methionine residues"], "ans": 1, "exp": "Restriction enzymes cut both sugar-phosphate backbones of double-stranded DNA at specific palindromic recognition sites without damaging the bases.", "ar": "يقطع سلسلتي العمود الفقري (السكر والفوسفات) دون إتلاف القواعد النيتروجينية.", "isPast": false, "isExpected": false}, {"m": "m5", "q": "From your Recognition Sequences table (Slide 109), which restriction enzyme produces a 3'-hydroxyl sticky extension, and which group produces BLUNT ends?", "opts": ["Sau3AI gives blunt ends; PvuII gives 5'-phosphate extension", "EcoRI gives 3'-OH extension; BamHI and NotI give blunt ends", "PstI gives 3'-OH extension; PvuII, HpaI, and HaeIII give blunt ends", "HaeIII gives 3'-OH extension; PstI and EcoRI give blunt ends"], "ans": 2, "exp": "Exact Slide 109 table: PstI (CTGCA↓G) = 3' hydroxyl extension; PvuII, HpaI, HaeIII = Blunt ends; EcoRI, BamHI, Sau3AI, NotI = 5' phosphate extensions!", "ar": "من جدول سلايد 109: PstI الوحيد يعطي طرف 3'، و PvuII / HpaI / HaeIII تعطي أطراف Blunt ملساء.", "isPast": false, "isExpected": false}, {"m": "m5", "q": "How does DNA delivery via Viral Vectors compare to Plasmid Vectors?", "opts": ["Plasmids infect cells naturally at 100% efficiency, whereas viruses require PEG dehydration", "Viral vectors only work in dead lysed cells on nylon membranes", "Viral vectors deliver DNA efficiently via infection, whereas plasmids require transfection (chemical/enzymatic permeabilization of host membrane)", "Both viral vectors and plasmids require aminopterin to enter E. coli"], "ans": 2, "exp": "Viral vectors package DNA into infectious virus particles (fairly efficient infection); plasmids require chemical and enzymatic treatment to make the host cell membrane permeable.", "ar": "النواقل الفيروسية تدخل بالعدوى بكفاءة، بينما البلازميدات تحتاج معالجة كيميائية وإنزيمية لإدخالها.", "isPast": false, "isExpected": false}, {"m": "m5", "q": "Why would a biotech company choose Chinese Hamster Ovary (CHO) mammalian cells (doubling time 18–24 hrs) over E. coli (doubling time 20–90 min) to produce a complex human glycoprotein?", "opts": ["E. coli lacks glycosylation, cannot secrete proteins, and improperly processes eukaryotic transcripts, whereas CHO cells properly splice RNA, glycosylate, cleave, refold, and secrete proteins", "CHO cells grow faster on cheaper media and resist shear forces better than E. coli", "CHO cells lack introns and ribosomes", "E. coli hyper-glycosylates proteins excessively compared to CHO cells"], "ans": 0, "exp": "Bacteria grow fast & cheaply but CANNOT glycosylate, secrete, or splice eukaryotic introns. Mammalian CHO cells grow slowly (18–24h) and are shear/pH-sensitive, but perform authentic RNA processing, glycosylation, cleavage, refolding, and secretion!", "ar": "لأن البكتيريا لا تضيف السكريات (Glycosylation) ولا تعالج جينات حقيقيات النوى، بعكس خلايا CHO الثديية.", "isPast": false, "isExpected": false}, {"m": "m5", "q": "What is the main disadvantage of using Yeast as a cloning host for human therapeutic glycoproteins?", "opts": ["Yeast media costs 100x more than mammalian cell culture", "Possible differences/variation in glycosylation compared to humans, and lower protein yield than bacteria", "Yeast cannot glycosylate or secrete any proteins at all", "Yeast grows slower than mammalian CHO cells (doubling time > 48 hours)"], "ans": 1, "exp": "Yeast grows rapidly on cheap media, secretes proteins readily, and CAN glycosylate—but its glycosylation patterns vary/differ from human glycoproteins, and total expression is lower than bacteria.", "ar": "الخميرة قادرة على إضافة السكر لكن نمط الـ Glycosylation فيها يختلف عن الإنسان وإنتاجيتها أقل من البكتيريا.", "isPast": false, "isExpected": false}, {"m": "m5", "q": "In the Fused Gene Method (e.g., fusing a small foreign gene to E. coli β-galactosidase), how is the pure foreign peptide chemically released after purification?", "opts": ["Treatment with EcoRI restriction endonuclease", "Adding aminopterin and hypoxanthine", "Heating to 95 °C with Taq polymerase", "Treatment with Cyanogen Bromide (CNBr), which cleaves specifically at Methionine residues"], "ans": 3, "exp": "Fusing to β-galactosidase drives high expression and stabilizes/protects small peptides. Placing a Methionine (Met) at the start of the foreign peptide allows CNBr to cleave it off cleanly.", "ar": "تستخدم مادة CNBr لأنها تقطع الببتيد كيميائياً عند الحمض الأميني Methionine الموضوع ببداية الببتيد.", "isPast": false, "isExpected": false}, {"m": "m5", "q": "In Case History A (Cloning 14-aa Human Somatostatin in E. coli), which combination of engineering features was built into the synthetic gene?", "opts": ["Cloned directly from genomic DNA with introns into Klebsiella pneumoniae", "Fused to lacZ (β-gal) + Methionine codon before N-terminal Ala + TWO stop codons after C-terminal Cys + EcoRI & BamHI sticky-end sites", "Introns added + Poly-A tail + PvuII blunt ends + cleaved by trypsin", "Fused to lamB outer membrane gene + 5 internal methionines + Sendai virus"], "ans": 1, "exp": "Somatostatin (14 aa, N-terminal Ala, C-terminal Cys, 0 internal Met) was fused to lacZ with a Met codon before Ala (for CNBr cleavage), 2 stop codons after Cys, and EcoRI/BamHI sticky sites.", "ar": "تم دمجه مع lacZ مع وضع Met قبل Ala (للقص بـ CNBr) وكودونين توقف بعد Cys ومواقع EcoRI و BamHI.", "isPast": false, "isExpected": false}, {"m": "m5", "q": "In Case History B, why and how were bacteria engineered to produce Quinic Acid?", "opts": ["To make benzoquinone & hydroquinone cleanly without petroleum benzene; Klebsiella pneumoniae quinic acid dehydrogenase was inserted into DHQ-overproducing E. coli (80 mM glucose → 25 mM quinic acid)", "To make insulin; human cDNA was inserted into Bacillus", "To produce β-blockers; 25 mM benzene was converted into 80 mM glucose", "To detoxify mercury spills; Sendai virus fused yeast with cinchona bark cells"], "ans": 0, "exp": "Quinic acid (used to synthesize hydroquinone for photography/antioxidants & benzoquinone) is scarce in cinchona bark and toxic/costly from petroleum benzene. Inserting Klebsiella's quinic acid dehydrogenase into DHQ-producing E. coli yields 25 mM quinic acid from 80 mM glucose.", "ar": "لإنتاج Hydroquinone و Benzoquinone من الجلوكوز بشكل نظيف بدل البنزين البترولي السام عبر نقل إنزيم من Klebsiella إلى E. coli.", "isPast": false, "isExpected": false}, {"m": "m5", "q": "In Case History C (Cloning human β1 and β2 adrenergic GPCRs in E. coli), why was the receptor gene fused to the bacterial 'lamB' gene?", "opts": ["lamB makes E. coli resistant to cyanogen bromide", "lamB encodes DNA ligase to repair plasmid nicks", "lamB supplies mammalian G-proteins for intracellular cAMP signaling", "lamB encodes an outer-membrane maltose transporter, directing the fusion receptor to be expressed on the outer surface of intact bacteria"], "ans": 3, "exp": "lamB encodes an E. coli outer membrane protein for maltose/maltodextrin transport; fusing β1/β2 cDNA to lamB displays functional binding receptors on the outer bacterial surface (verified with ¹²⁵I-iodocyanopindolol; 1 L = ~13,000 assays).", "ar": "جين lamB ينتج بروتين غشاء خارجي لنقل المالتوز، فيوجه المستقبل الدوائي ليظهر على السطح الخارجي للبكتيريا.", "isPast": false, "isExpected": false}, {"m": "m5", "q": "What is the key biological limitation of using E. coli expressing β1/β2 GPCRs on their outer surface for drug screening?", "opts": ["Bacteria lack endogenous signal transducers (G-proteins), so ligand binding CAN be measured, but functional responses CANNOT be measured", "Radioligands like ¹²⁵I-iodocyanopindolol cannot bind intact whole bacteria", "cDNA libraries contain introns that prevent lamB transcription", "1 liter of bacteria only provides enough material for 2 assays"], "ans": 0, "exp": "Whole-cell bacteria work great for cheap radioligand binding assays (1 L = 13,000 assays), BUT bacteria lack G-proteins—so downstream functional signaling cannot be measured!", "ar": "البكتيريا تفتقر لوجود G-proteins بداخلها، لذلك تصلح لفحص ارتباط الدواء بالمستقبل (Binding) فقط وليس الاستجابة الوظيفية!", "isPast": false, "isExpected": false}, {"m": "m5", "q": "Which step sequence correctly describes 'Screening Colonies by Hybridization'?", "opts": ["Treat colonies with CNBr → stain withheme → count plaques", "Inject colonies into mouse peritoneum → harvest ascitic fluid → run PCR at 54°C", "Add primary antibody → add secondary antibody → observe color reaction in liquid broth", "Transfer cells to nylon membrane & lyse → bind & denature DNA → hybridize labeled nucleic acid probe → wash & detect by autoradiography"], "ans": 3, "exp": "Colony hybridization detects target DNA: transfer to nylon membrane → lyse cells → denature bound DNA → hybridize nucleic acid probe → wash → autoradiography.", "ar": "فحص التهجين يكشف الـ DNA عبر نقل الخلايا لغشاء نايلون وتحليلها واستخدام مسبار مشع والتصوير الإشعاعي Autoradiography.", "isPast": false, "isExpected": false}, {"m": "m5", "q": "When screening engineered bacterial colonies by Immunological Assay (Slide 140), why is a 'Master Plate' kept before lysing cells on the matrix?", "opts": ["Because cells transferred to the matrix are lysed to bind their proteins for primary/secondary antibody color detection, so viable cells must be subcultured from the matching colony on the master plate", "Because the master plate is heated to 95°C to denature genomic DNA", "Because nylon membranes convert E. coli into CHO cells", "Because primary antibodies only bind to supercoiled plasmids on agar"], "ans": 0, "exp": "Immunoassay lyses the transferred imprint to detect the expressed protein (Primary Ab → Enzyme-linked Secondary Ab → color reaction), then you go back to the living Master Plate to subculture the positive colony!", "ar": "لأن الخلايا المنقولة للغشاء يتم تدميرها (Lysis) لاستخراج البروتين وفحصه بالأجسام المضادة، فنرجع لطبق الأصل (Master plate) لأخذ البكتيريا الحية!", "isPast": false, "isExpected": false}, {"m": "m2", "q": "According to Slide 43, rat plasmacytoma (myeloma) cell lines used in hybridoma work were derived from which anatomical site?", "opts": ["Ileocecal lymph nodes of rats", "Arctic salamander liver", "Chinese hamster ovary", "Rat cerebral cortex"], "ans": 0, "exp": "Slide 43 specifically notes: 'Myeloma cells: Rat plastocytoma [plasmacytoma] derived from the ileocecal lymph nodes of rats.'", "ar": "معلومة حرفية من سلايد 43: خلايا المايلوما الجرذية اشتُقت من العقد اللمفاوية اللفائفية الأعورية (Ileocecal lymph nodes).", "isPast": false, "isExpected": false}, {"m": "m6", "q": "A clinician prescribes a therapeutic monoclonal antibody that ends in the suffix '-ximab'. Which statement correctly describes this drug?", "opts": ["It is 100% murine and carries the highest risk of HAMA allergic reactions.", "It is a fully human antibody generated by transgenic mice.", "It is a chimeric antibody containing approximately 65% human constant region and 35% mouse variable regions.", "It contains only mouse hypervariable CDR loops inserted into a 95% human framework."], "ans": 2, "exp": "The suffix '-ximab' designates a chimeric monoclonal antibody (~65% human IgG constant region with ~35% mouse variable antigen-binding domains).", "ar": "اللاحقة -ximab تعني جسم مضاد مختلط خيالي (حوالي 65% بشري و35% فأر).", "isPast": false, "isExpected": false}, {"m": "m6", "q": "Which monoclonal antibody is a FULLY HUMAN (100% human protein) IgG1 that neutralizes Tumor Necrosis Factor-alpha (TNF-α) via subcutaneous injection?", "opts": ["Muromonab-CD3", "Trastuzumab", "Infliximab", "Adalimumab"], "ans": 3, "exp": "Adalimumab (Humira) ends in '-umab' (fully human) and targets TNF-alpha, administered subcutaneously. Infliximab also targets TNF-alpha but is chimeric ('-ximab') and given via IV infusion.", "ar": "Adalimumab دواء بشري بالكامل (-umab) يعالج TNF-alpha ويعطى تحت الجلد.", "isPast": false, "isExpected": false}, {"m": "m6", "q": "Rituximab (Rituxan) is clinically indicated for Non-Hodgkin Lymphoma and Rheumatoid Arthritis because it selectively binds to which target?", "opts": ["Vascular Endothelial Growth Factor (VEGF-A) in the circulation", "CD3 epsilon chain on cytotoxic T-cells", "HER2/neu receptor on breast epithelial cells", "CD20 surface antigen on B-lymphocytes, triggering ADCC and complement lysis"], "ans": 3, "exp": "Rituximab binds CD20 on pre-B and mature B-cells, tagging malignant or autoreactive B-cells for destruction by natural killer cells (ADCC) and complement (CDC).", "ar": "Rituximab يرتبط بـ CD20 على خلايا B ليدمرها في سرطانات الغدد الليمفاوية والروماتيزم.", "isPast": false, "isExpected": false}, {"m": "m6", "q": "How does Bevacizumab (Avastin) exert its therapeutic anticancer effect in colorectal cancer patients?", "opts": ["By stimulating osteoclasts via RANKL upregulation", "By cleaving methionine residues in foreign fusion proteins via cyanogen bromide", "By binding to VEGF-A and inhibiting angiogenesis, preventing the formation of new blood vessels that feed the tumor", "By directly inserting pore-forming Membrane Attack Complexes into cancer cell nuclei"], "ans": 2, "exp": "Bevacizumab binds VEGF-A to block angiogenesis (new vascular capillary formation), effectively starving solid tumors of oxygen and nutrients.", "ar": "Bevacizumab يعطل VEGF ليمنع تكوين أوعية دموية جديدة تغذي الورم السرطاني (Angiogenesis).", "isPast": false, "isExpected": false}, {"m": "m6", "q": "Trastuzumab (Herceptin) is a humanized monoclonal antibody designed specifically to treat tumors overexpressing which target receptor?", "opts": ["Immunoglobulin E (IgE) on circulating mast cells", "CD3 receptor on allograft-infiltrating T-lymphocytes", "Epidermal Growth Factor Receptor 2 (HER2/neu / ErbB2)", "Platelet Glycoprotein IIb/IIIa receptors"], "ans": 2, "exp": "Trastuzumab targets the extracellular domain of the HER2/neu (ErbB2) receptor, primarily in HER2-positive breast cancer and gastric adenocarcinoma.", "ar": "Trastuzumab يستهدف مستقبل HER2 في سرطان الثدي الإيجابي لـ HER2.", "isPast": false, "isExpected": false}, {"m": "m6", "q": "Muromonab-CD3 (OKT3) is classified as a mouse monoclonal antibody ('-omab'). What is its primary clinical indication?", "opts": ["Age-related macular degeneration (wet AMD)", "Severe allergic bronchial asthma", "Acute organ transplant rejection (e.g. kidney allografts)", "Postmenopausal osteoporosis"], "ans": 2, "exp": "Muromonab-CD3 was the first therapeutic mAb approved; it binds CD3 on T-cells to block and clear them, reversing acute renal and cardiac transplant rejection.", "ar": "Muromonab-CD3 فأري يرتبط بـ CD3 على خلايا T لمنع وعلاج رفض زراعة الأعضاء.", "isPast": false, "isExpected": false}, {"m": "m6", "q": "In the Immune System video (Video 1), which cell type expresses MHC Class II molecules and presents processed antigens to CD4+ Helper T-cells?", "opts": ["Cytotoxic CD8+ T-cells only", "Antigen-Presenting Cells (APCs) such as Dendritic cells and Macrophages", "Platelets", "Red blood cells (erythrocytes)"], "ans": 1, "exp": "APCs (Dendritic cells, macrophages, B-cells) express MHC Class II to present foreign antigens to CD4+ Helper T-cells. (All nucleated cells express MHC Class I for CD8+ cells).", "ar": "الخلايا العارضة للمستضد APCs مثل Dendritic cells و Macrophages تعرض على MHC II لخلايا CD4.", "isPast": false, "isExpected": false}, {"m": "m6", "q": "Which pair of monoclonal antibodies are BOTH directed against Tumor Necrosis Factor-alpha (TNF-α), but differ in their origin and administration route?", "opts": ["Muromonab-CD3 (Oral) and Bevacizumab (IV)", "Rituximab (IV) and Trastuzumab (SC)", "Infliximab (Chimeric, IV) and Adalimumab (Fully Human, SC)", "Denosumab (Topical) and Omalizumab (Nasal)"], "ans": 2, "exp": "Infliximab is chimeric ('-ximab') gi apparatus) في الخلية؟", "isPast": true, "isExpected": false, "pastNum": 4}, {"q": "Dideoxyribonucleotides (ddNTPs) used for DNA sequencing lack oxygen atoms at _______", "opts": ["Non", "the 1' carbon of the pentose sugar", "the 1' and 2' carbons of the pentose sugar", "the 2' and 3' carbons of the hexos sugar", "the 5' carbon of the pentose sugar"], "ans": 0, "exp": "الـ ddNTPs تفقد ذرتي أكسجين عند الموضعين 2' و 3' من السكر الخماسي (Pentose sugar). الخيار D كتب فيه 'hexos sugar' (سكر سداسي)! وبما أن سكر الـ DNA هو سكر خماسي دائماً، فإن العبارة D خاطئة كيميائياً، وبذلك يكون الجواب الصحيح الخالي من الأخطاء هو Non.<br>📚 <b>Ref:</b> تقنيات تسلسل الـ DNA: Sanger Sequencing & Dideoxynucleotide Structure<br>⚠️ <b>Exam Trap:</b> ⚠️ فخ امتحاني خبيث: الخيار D ذكر 'hexos sugar' وليس pentose! سكر الـ DNA هو Pentose (خماسي)، لذلك الخيار D غير صحيح علمياً، والإجابة الدقيقة المعتمدة هي Non.", "m": "past", "ar": "تفتقر النيوكليوتيدات منزوعة الأكسجين الثنائية (ddNTPs) المستخدمة في تسلسل الـ DNA إلى ذرات الأكسجين عند _______", "isPast": true, "isExpected": false, "pastNum": 5}, {"q": "The extra chromosomal, self replicating, double stranded, closed, circular DNA molecules are called:", "opts": ["Viruses", "Phages", "Plasmids", "Chloroplasts"], "ans": 2, "exp": "هذا هو التعريف الحرفي المعتمد للبلازميدات (Plasmids) كما ورد في سلايد 3 و 4: جزيئات DNA دائرية مغلقة ثنائية السلسلة وخارج الكروموسوم وتتضاعف ذاتياً داخل البكتيريا.<br>📚 <b>Ref:</b> سلايدات الوحدة 4: 04-Recombinant-DNA-Technology (Slide 3 & Slide 4)", "m": "past", "ar": "جزيئات الـ DNA الإضافية خارج الكروموسوم، ذاتية التضاعف، ثنائية السلسلة، والمغلقة والدائرية تسمى:", "isPast": true, "isExpected": false, "pastNum": 6}, {"q": "Which carbon of the deoxyribose sugar of the nucleotide binds to the nitrogen base?", "opts": ["2'", "5'", "1'", "4'", "3'"], "ans": 2, "exp": "في النيوكليوتيد: ترتبط القاعدة النيتروجينية دائماً بذرة الكربون 1' (رابطة جليكوسيدية). بينما ترتبط مجموعة الفوسفات بالكربون 5'، والهيدروكسيل الحر بالكربون 3'.<
