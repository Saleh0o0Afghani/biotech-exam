ow much more faster than bacterial cells:", "opts": ["True (صحيح)", "False (خطأ)"], "ans": 1, "exp": "الخلايا البكتيرية تتضاعف كل 20-30 دقيقة، بينما تحتاج الخلايا الورمية حقيقية النواة إلى 18-24 ساعة على الأقل للدورة الواحدة. البكتيريا أسرع بعشرات الأضعاف.<br>📚 <b>Ref:</b> مبادئ زراعة الخلايا ومقارنة معدلات النمو<br>⚠️ <b>Exam Trap:</b> رغم سرعة نمو الأورام مقارنة بالأنسجة الطبيعية، إلا أنها تظل أبطأ بمراحل من البكتيريا.", "m": "past", "ar": "تنمو وتنقسم الخلايا الورمية حقيقية النواة بسرعة تفوق كثيراً الخلايا البكتيرية:", "isPast": true, "isExpected": false, "pastNum": 87}, {"q": "ELISA is a type of a homogeneous immunoassay.", "opts": ["True (صحيح)", "False (خطأ)"], "ans": 1, "exp": "فحص الإليزا يُصنف كفحص غير متجانس (Heterogeneous immunoassay) لأنه يتطلب طوراً صلباً وسلسلة من خطوات الغسيل (Washing) لفصل المعقدات المرتبطة عن الجزيئات الحرة.<br>📚 <b>Ref:</b> المحاضرة 05: تقنيات الإليزا وتصنيفاتها<br>⚠️ <b>Exam Trap:</b> Heterogeneous = Requires washing/separation. Homogeneous = No washing required.", "m": "past", "ar": "فحص الإليزا هو نوع من المقايسات المناعية المتجانسة (Homogeneous):", "isPast": true, "isExpected": false, "pastNum": 88}, {"q": "ELISA is a procedure that can measure the concentration of antigens but not antibodies:", "opts": ["True (صحيح)", "False (خطأ)"], "ans": 1, "exp": "تقنية الإليزا تقيس المستضدات (عبر Sandwich ELISA) وتقيس الأجسام المضادة بدقة فائقة (عبر Indirect ELISA مثل تشخيص الأجسام المضادة لـ HIV أو COVID-19).<br>📚 <b>Ref:</b> المحاضرة 05: تطبيقات الإليزا المباشرة وغير المباشرة<br>⚠️ <b>Exam Trap:</b> الإليزا تقيس كلاً من Antigens و Antibodies.", "m": "past", "ar": "الإليزا هي إجراء مخبري يمكنه قياس تركيز المستضدات ولكن لا يمكنه قياس الأجسام المضادة:", "isPast": true, "isExpected": false, "pastNum": 89}, {"q": "A cryoprotectant is used in order to:", "opts": ["to allow slow freezing", "to prevent growth of microbes", "to prevent damage to cells during freezing (حماية الخلايا من التلف أثناء التجميد)", "prevent cells from freezing"], "ans": 2, "exp": "المواد الحامية من التجميد (مثل DMSO والغليسيرول) تخترق أغشية الخلايا وتمنع تكوّن بلورات الجليد القاتلة التي تمزق العضيات والأغشية الخلوية أثناء الحفظ بالنيتروجين السائل (-196°C).<br>📚 <b>Ref:</b> تقنيات الحفظ بالتجميد (Cryopreservation)<br>⚠️ <b>Exam Trap:</b> الهدف ليس منع التجمد كلياً، بل منع التلف الناتج عن تبلور الجليد.", "m": "past", "ar": "تُستخدم المادة الحامية من التجميد (Cryoprotectant) من أجل:", "isPast": true, "isExpected": false, "pastNum": 91}, {"q": "Autoradiography is:", "opts": ["a process where radioactive antibodies are added to proteins", "The process of Using x-ray film To locate radioactivity (استخدام فيلم أشعة سينية لتحديد موقع الإشعاع)", "the process of measuring radioactivity of an isotope", "all answers are true"], "ans": 1, "exp": "تقنية Autoradiography تعتمد على تعريض فيلم أشعة سينية حساس (X-ray film) للنظائر المشعة في العينة الحيوية لتحديد المكان الجغرافي الدقيق للشرائط المشعة على الهلام أو الغشاء.<br>📚 <b>Ref:</b> المحاضرة 01 & 04: تقنيات الهجرة والتصوير الإشعاعي<br>⚠️ <b>Exam Trap:</b> قياس كمية الإشعاع يسمى عداد الوميض، أما Autoradiography فهو تصوير لتحديد الموقع (Locate).", "m": "past", "ar": "التصوير الإشعاعي الذاتي (Autoradiography) هو:", "isPast": true, "isExpected": false, "pastNum": 92}, {"q": "The basic components of tissue culture media are _______", "opts": ["micro and macro nutrients and growth regulators, glucose", "micro and macro nutrients, vitamins, agar", "micro and macro nutrients, glucose", "micro and macro nutrients, growth regulators, agar, vitamins, glucose"], "ans": 3, "exp": "بيئات زراعة الأنسجة النباتية المعتمدة (مثل MS medium) تشتمل إلزامياً على: العناصر الكبرى والصغرى غير العضوية، الهرمونات ومنظمات النمو (Auxins/Cytokinins)، مادة الأغار للدعامة، الفيتامينات، وسكر الغلوكوز أو السكروز كمصدر كربون وطاقة.<br>📚 <b>Ref:</b> المحاضرة 02: Plant Biotechnology & Tissue Culture<br>⚠️ <b>Exam Trap:</b> اختر دائماً الإجابة الأشمل التي تحتوي على كافة المكونات الستة الأساسية.", "m": "past", "ar": "المكونات الأساسية لبيئة زراعة الأنسجة النباتية هي:", "isPast": true, "isExpected": false, "pastNum": 93}, {"q": "Splicing is a process that involves removing the exons, which are non-coding sequences in the RNA before the attachment to the ribosome", "opts": ["true", "false"], "ans": 1, "exp": "العبارة معكوسة وخاطئة تماماً؛ فالتضفير يزيل الإنترونات (Introns) لأنها غير مشفرة، ويبقي ويربط الإكسونات (Exons) لأنها التتابعات المشفرة المعبرة التي تترجم لبروتين.<br>📚 <b>Ref:</b> المحاضرة 03: Protein Biosynthesis & Post-transcriptional Modifications<br>⚠️ <b>Exam Trap:</b> Exons are Expressed (kept), Introns are Intervening (removed).", "m": "past", "ar": "عملية التضفير (Splicing) هي عملية تتضمن إزالة الإكسونات، وهي التتابعات غير المشفرة في الرنا قبل ارتباطه بالريبوسوم:", "isPast": true, "isExpected": false, "pastNum": 94}, {"q": "A medium which is composed of chemically defined compound is called:", "opts": ["Non", "Artificial media", "Synthetic media (بيئة اصطناعية محددة كيميائياً)", "Natural media"], "ans": 2, "exp": "البيئات التركيبية المحددة كيميائياً (Synthetic / Chemically defined media) تكون كافة تراكيبها ونسبها الكيميائية معلومة بدقة، بخلاف البيئات الطبيعية (Natural media) التي تحتوي مكونات غير محددة التركيب كالمصل أو المستخلصات.<br>📚 <b>Ref:</b> أنواع أوساط الزراعة الخلوية والنباتية<br>⚠️ <b>Exam Trap:</b> Chemically defined = Synthetic media.", "m": "past", "ar": "البيئة الغذائية التي تتكون من مركبات كيميائية محددة ومعروفة بدقة تُسمى:", "isPast": true, "isExpected": false, "pastNum": 100}, {"m": "expected", "isExpected": true, "isPast": false, "q": "When expressing a human insulin gene in an Escherichia coli bacterial expression host, the molecular biotechnologist must specifically use:", "opts": ["Genomic DNA directly extracted from human pancreatic beta islet cells.", "Complementary DNA (cDNA) synthesized from mature cytoplasmic mRNA using reverse transcriptase.", "Nuclear pre-mRNA containing both non-coding introns and coding exons.", "Human ribosomal RNA subunits to facilitate bacterial initiation."], "ans": 1, "exp": "Human genomic DNA contains non-coding intervening sequences (introns). Prokaryotic bacteria lack the spliceosome machinery required for post-transcriptional RNA splicing. Therefore, cloning genomic DNA into bacteria leads to aberrant proteins retaining introns with premature termination. Biotechnologists must use cDNA, which is synthesized from mature, spliced mRNA.<br>📚 <b>Ref:</b> Lecture 04: Recombinant DNA Technology (Cloning vectors & cDNA Libraries)<br>⚠️ <b>Exam Trap:</b> Never choose genomic DNA for bacterial expression of human genes! Bacteria cannot remove introns.", "ar": "سؤال متوقع من نمط الدكتور: Recombinant DNA Technology & cDNA"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "In a Competitive ELISA assay designed to quantify a therapeutic drug in serum, if the patient's drug concentration is extremely high, the resulting measured signal (optical absorbance) will be:", "opts": ["Extremely high, because more chromogenic substrate is catalyzed by bound enzyme.", "Near zero or very low, because the unlabelled patient drug outcompetes the enzyme-labelled drug for antibody binding sites.", "Directly proportional to the patient's serum antibody titer.", "Completely unchanged, because competitive assays do not depend on analyte concentration."], "ans": 1, "exp": "In competitive immunoassay formats, unlabelled analyte (from the patient sample) competes with enzyme-labelled analyte for a limited, fixed number of immobilized antibody binding sites. A high analyte concentration displaces the labelled tracer, resulting in less bound enzyme after washing, and thus a very low absorbance signal (strictly inversely proportional).<br>📚 <b>Ref:</b> Lecture 05: Monoclonal Antibodies & Immunoassay Principles<br>⚠️ <b>Exam Trap:</b> Competitive assays = INVERSE relationship (High analyte = Low signal). Non-competitive / Sandwich = DIRECT relationship.", "ar": "سؤال متوقع من نمط الدكتور: Immunoassays & Competitive ELISA"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "In the blue-white screening system using plasmid vectors containing the lacZ gene, recombinant bacterial colonies that successfully incorporated the foreign human DNA insert appear:", "opts": ["Blue, because active beta-galactosidase hydrolyzes X-gal into a blue precipitate.", "White, because the lacZ alpha-peptide reading frame is disrupted by insertional inactivation.", "Transparent and non-viable, because ampicillin kills all transformed bacterial cells.", "Dark green, due to the synergistic interaction between IPTG and ampicillin."], "ans": 1, "exp": "The multiple cloning site (MCS) is strategically placed within the lacZ alpha-peptide coding region. Ligation of a foreign DNA fragment into the MCS disrupts the reading frame (insertional inactivation), abolishing beta-galactosidase activity. Recombinant bacteria cannot cleave X-gal and remain white. Non-recombinants maintain an intact lacZ, produce active enzyme, cleave X-gal, and turn blue.<br>📚 <b>Ref:</b> Lecture 04: Recombinant DNA Technology (Slide 20-25: Blue-White Screening)<br>⚠️ <b>Exam Trap:</b> Remember: White colonies = Recombinant (successful insert). Blue colonies = Non-recombinant (empty vector).", "ar": "سؤال متوقع من نمط الدكتور: Cloning Vectors & Selection Markers"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Which component of HAT selective medium specifically inhibits the enzyme dihydrofolate reductase, thereby completely blocking the de novo pathway of purine and pyrimidine nucleotide synthesis?", "opts": ["Hypoxanthine", "Aminopterin", "Thymidine", "Polyethylene glycol (PEG)"], "ans": 1, "exp": "Aminopterin is a potent folic acid analogue that competitively inhibits dihydrofolate reductase (DHFR), shutting down the de novo pathway of nucleotide synthesis. Cells are forced to depend entirely on the salvage pathway, utilizing Hypoxanthine (via HGPRT) and Thymidine (via TK).<br>📚 <b>Ref:</b> Lecture 05: Monoclonal Antibodies (Slide 16-17: Selection of Hybridomas)<br>⚠️ <b>Exam Trap:</b> Aminopterin is the poison/blocker. Hypoxanthine and Thymidine are the salvage precursors.", "ar": "سؤال متوقع من نمط الدكتور: Hybridoma Technology & HAT Medium"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "A restriction endonuclease recognizes the specific palindromic sequence 5'-GAATTC-3'. What is the exact sequence of the complementary strand read in its 5' to 3' direction?", "opts": ["5'-CTTAAG-3'", "5'-GAATTC-3'", "5'-AATTCC-3'", "5'-TTAAGG-3'"], "ans": 1, "exp": "A palindromic sequence possesses two-fold rotational symmetry; it reads identically on both antiparallel strands in the 5' to 3' direction. The complementary strand paired to 5'-GAATTC-3' runs 3'-CTTAAG-5', which read 5' to 3' is 5'-GAATTC-3'. This is the classical EcoRI restriction site.<br>📚 <b>Ref:</b> Lecture 04: Recombinant DNA Technology (Restriction Endonucleases)<br>⚠️ <b>Exam Trap:</b> Always read the complementary strand in the 5' -> 3' direction when checking for palindromes!", "ar": "سؤال متوقع من نمط الدكتور: Restriction Endonucleases & Palindromes"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "The primary biophysical mechanism by which Dimethyl Sulfoxide (DMSO) acts as a cryoprotectant during the deep freezing (-196°C) of hybridoma and mammalian cell lines is:", "opts": ["Serving as an energetic carbon and nitrogen source during ultra-low temperature dormancy.", "Penetrating the cell membrane, depressing the freezing point, and preventing lethal intracellular ice crystal formation.", "Selectively cross-linking bacterial cell walls to prevent mycoplasma contamination.", "Inducing instantaneous vitrification within 2 seconds without cell shrinkage."], "ans": 1, "exp": "During deep freezing, water molecules form sharp ice crystals that shear and puncture intracellular organelles and plasma membranes, causing cell lysis upon thawing. Cryoprotectants like DMSO and glycerol freely penetrate lipid bilayers, hydrogen-bond with water, depress the freezing point, and prevent mechanical ice crystal damage.<br>📚 <b>Ref:</b> Lecture 05: Monoclonal Antibodies (Slide 21: Cryoprotectant)<br>⚠️ <b>Exam Trap:</b> DMSO prevents physical mechanical damage caused by ice crystal growth.", "ar": "سؤال متوقع من نمط الدكتور: Cryopreservation & Cell Banking"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "The anti-inflammatory biopharmaceutical Etanercept (Enbrel) is structurally engineered as a recombinant fusion protein consisting of:", "opts": ["The variable Fab fragment of a mouse monoclonal antibody linked to human serum albumin.", "The extracellular ligand-binding domain of human p75 TNF receptor fused to the Fc region of human IgG1.", "A full-length chimeric monoclonal antibody directed against interleukin-6.", "A PEGylated Fab' fragment of anti-TNF alpha."], "ans": 1, "exp": "Etanercept is a dimeric soluble receptor fusion protein. It consists of the extracellular ligand-binding domain of the human 75 kDa (p75) tumor necrosis factor receptor (TNFR) linked to the constant Fc fraction (CH2 and CH3 domains) of human immunoglobulin G1 (IgG1). The Fc moiety confers stability and extends its circulating serum half-life significantly.<br>📚 <b>Ref:</b> Lecture 04 & Past Exams: Recombinant Fusion Proteins (Etanercept Structure)<br>⚠️ <b>Exam Trap:</b> Etanercept is fused specifically to the Fc domain of IgG1, NOT IgG2, IgG3, or IgG4.", "ar": "سؤال متوقع من نمط الدكتور: Recombinant Biopharmaceuticals"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Which of the following represents the correct thermodynamic sequence of thermal cycling steps in a standard PCR amplification cycle?", "opts": ["Extension (72°C) -> Annealing (55°C) -> Denaturation (95°C)", "Denaturation (94-95°C) -> Annealing (50-65°C) -> Extension (72°C)", "Denaturation (95°C) -> Extension (72°C) -> Annealing (55°C)", "Annealing (72°C) -> Denaturation (95°C) -> Termination (37°C)"], "ans": 1, "exp": "A standard PCR cycle consists of three steps: (1) Denaturation at 94-95°C to break interstrand hydrogen bonds and melt double-stranded DNA into single strands; (2) Annealing at 50-65°C to allow synthetic oligonucleotide primers to hybridize to their complementary targets; (3) Extension / Elongation at 72°C, the optimal catalytic temperature for thermostable Taq DNA polymerase.<br>📚 <b>Ref:</b> Lecture 02: Polymerase Chain Reaction (Slide 5-9: PCR Steps & Temperature)<br>⚠️ <b>Exam Trap:</b> Annealing temperature is always lower than extension temperature! Order: Denature -> Anneal -> Extend.", "ar": "سؤال متوقع من نمط الدكتور: Polymerase Chain Reaction (PCR)"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Why is Taq DNA polymerase uniquely capable of surviving repetitive heating cycles up to 95°C without undergoing irreversible thermal denaturation?", "opts": ["It was isolated from the hyperthermophilic aquatic bacterium Thermus aquaticus found in thermal hot springs.", "It contains a high concentration of synthetic polyethylene glycol within its active site.", "It uses RNA ribonucleotides rather than deoxyribonucleotides as building blocks.", "It possesses an active 3' to 5' proofreading exonuclease domain."], "ans": 0, "exp": "Taq DNA polymerase is derived from Thermus aquaticus, a thermophilic eubacterium that thrives in geothermal hot springs at 70-80°C. Its enzymes have evolved dense hydrophobic cores and reinforced ionic networks, rendering them exceptionally heat-resistant and capable of withstanding the 95°C denaturation step of PCR.<br>📚 <b>Ref:</b> Lecture 02: PCR (Slide 8: Thermus aquaticus & Taq Polymerase)<br>⚠️ <b>Exam Trap:</b> Taq lacks 3'->5' proofreading activity (unlike Pfu), but its hallmark property is thermostability derived from T. aquaticus.", "ar": "سؤال متوقع من نمط الدكتور: Thermostable Enzymes in PCR"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "A patient with acute lymphoblastic leukemia (ALL) is homozygous deficient for the Thiopurine S-methyltransferase (TPMT) gene. If treated with standard doses of 6-Mercaptopurine or Azathioprine, what clinical outcome is anticipated?", "opts": ["Rapid hypermetabolism of the drug resulting in complete therapeutic failure.", "Massive accumulation of toxic active 6-thioguanine nucleotides (6-TGN), causing life-threatening bone marrow aplasia (myelosuppression).", "Severe anaphylactic shock mediated by anti-drug IgE antibodies within 5 minutes.", "No noticeable effect, because TPMT is an inactive pseudogene in human tissues."], "ans": 1, "exp": "TPMT is the primary phase II methylating enzyme responsible for the metabolic inactivation of thiopurines (Azathioprine, 6-MP). When TPMT activity is absent or deficient due to genetic polymorphism, thiopurines are shunted into the hypoxanthine phosphoribosyltransferase (HPRT) pathway, generating toxic 6-thioguanine nucleotides (6-TGN). These incorporate into DNA and trigger fatal hematopoietic bone marrow toxicity.<br>📚 <b>Ref:</b> Lecture 06: Personalized Medicine & Pharmacogenomics (TPMT Testing)<br>⚠️ <b>Exam Trap:</b> TPMT deficiency = Drug toxicity and bone marrow suppression, requiring an 80-90% dose reduction!", "ar": "سؤال متوقع من نمط الدكتور: Pharmacogenomics & Personalized Medicine"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Which analytical blotting technique is specifically designed to detect and quantify messenger RNA (mRNA) transcripts using labelled nucleic acid probes?", "opts": ["Southern blotting", "Northern blotting", "Western blotting", "Eastern blotting"], "ans": 1, "exp": "The mnemonic 'SNOW DROP' defines blotting modalities: Southern blottings analyze DNA; Northern blottings analyze RNA; Western blottings analyze Protein (using antibodies). Therefore, mRNA transcript quantification is performed via Northern blotting.<br>📚 <b>Ref:</b> Lecture 04: Recombinant DNA (Blotting Techniques & Gene Expression)<br>⚠️ <b>Exam Trap:</b> Southern = DNA, Northern = RNA, Western = Protein (Immunoblotting).", "ar": "سؤال متوقع من نمط الدكتور: Macromolecular Blotting Techniques"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "The essential enzyme that seals single-stranded nicks by catalyzing the synthesis of a covalent phosphodiester bond between adjacent Okazaki fragments during lagging-strand synthesis is:", "opts": ["DNA Helicase", "DNA Topoisomerase (Gyrase)", "DNA Ligase", "DNA Primase"], "ans": 2, "exp": "DNA Polymerase I removes RNA primers and fills the gaps with deoxyribonucleotides, but it cannot join the final 3'-OH and 5'-monophosphate ends. DNA Ligase uses ATP (or NAD+ in bacteria) to seal this nick by creating a covalent phosphodiester bond, uniting the Okazaki fragments into a continuous strand.<br>📚 <b>Ref:</b> Lecture 01: DNA Structure & Replication (Enzymes of Replication)<br>⚠️ <b>Exam Trap:</b> Ligase connects/glues fragments together via phosphodiester bonds.", "ar": "سؤال متوقع من نمط الدكتور: DNA Replication Machinery"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Inclisiran (Leqvio) is a novel cholesterol-lowering therapeutic consisting of a chemically stabilized small interfering RNA (siRNA). It lowers serum LDL-cholesterol by:", "opts": ["Directly inhibiting the hepatic enzymatic activity of HMG-CoA reductase.", "Binding to and neutralizing LDL particles directly in the circulating bloodstream.", "Directing the RISC complex to degrade PCSK9 mRNA, preventing PCSK9 synthesis and thereby increasing the recycling and surface density of LDL receptors on hepatocytes.", "Enhancing the lysosomal degradation of hepatic LDL receptors."], "ans": 2, "exp": "PCSK9 normally binds to LDL receptors on hepatocyte surfaces and targets them for lysosomal degradation. Inclisiran is a hepatocyte-targeted siRNA that silences the PCSK9 gene by cleavage of its mRNA via the RNA-induced silencing complex (RISC). This halts PCSK9 protein synthesis, allowing LDL receptors to be continuously recycled back to the liver cell membrane, dramatically accelerating clearance of LDL-C from circulation.<br>📚 <b>Ref:</b> Lecture 06: Personalized Medicine (RNAi Therapeutics - Inclisiran)<br>⚠️ <b>Exam Trap:</b> Inclisiran DECREASES PCSK9 protein synthesis, which INCREASES LDL receptor surface expression!", "ar": "سؤال متوقع من نمط الدكتور: RNA Interference & Gene Silencing"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "In plant in vitro cell culture, an unorganized, proliferating, dedifferentiated mass of parenchymatous cells derived from an explant is scientifically termed a:", "opts": ["Protoplast", "Callus", "Meristem", "Somatic embryo"], "ans": 1, "exp": "When an excised plant tissue piece (explant) is cultured on an artificial nutrient medium containing balanced auxin and cytokinin levels, its differentiated cells revert to an unorganized, rapidly proliferating mass of meristematic cells known as a Callus.<br>📚 <b>Ref:</b> Lecture 02: Plant Biotechnology & Tissue Culture (Callus Induction)<br>⚠️ <b>Exam Trap:</b> Callus = Unorganized, dedifferentiated cell mass.", "ar": "سؤال متوقع من نمط الدكتور: Plant Tissue Culture Principles"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Which of the following cloning vector systems possesses the highest insert-cloning capacity, capable of accommodating genomic DNA fragments between 100 to 300 kilobase pairs (kb)?", "opts": ["Standard bacterial plasmid (e.g., pBR322)", "Bacteriophage lambda replacement vector", "Cosmid vector", "Bacterial Artificial Chromosome (BAC)"], "ans": 3, "exp": "Plasmids accept inserts up to ~10 kb; Lambda phages up to ~20 kb; Cosmids up to ~45 kb; whereas Bacterial Artificial Chromosomes (BACs), based on the single-copy F-plasmid of E. coli, can stably maintain large genomic inserts of 100-300 kb.<br>📚 <b>Ref:</b> Lecture 04: Recombinant DNA (Vector Classification & Capacities)<br>⚠️ <b>Exam Trap:</b> Capacity ranking: Plasmid < Lambda < Cosmid < BAC < YAC.", "ar": "سؤال متوقع من نمط الدكتور: Cloning Vector Capacities"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "ELISA (Enzyme-Linked Immunosorbent Assay) is rigorously classified as a 'Heterogeneous' immunoassay primarily because:", "opts": ["It can be applied to diverse biological fluids including urine, serum, and saliva.", "It utilizes secondary antibodies derived from a different animal species.", "It requires physical phase-separation and wash steps to separate solid-bound antibody-antigen complexes from free, unbound reagents.", "It employs both monoclonal and polyclonal antibodies simultaneously."], "ans": 2, "exp": "Heterogeneous immunoassays require physical separation (washing) of the bound fraction (attached to a solid phase like polystyrene microtiter wells) from the free/unbound fraction before signal detection. Homogeneous immunoassays (e.g., EMIT) alter signal upon binding without requiring any washing or phase-separation.<br>📚 <b>Ref:</b> Lecture 05: Immunoassays (Heterogeneous vs Homogeneous)<br>⚠️ <b>Exam Trap:</b> Heterogeneous = Requires washing/separation. Homogeneous = NO wash steps required.", "ar": "سؤال متوقع من نمط الدكتور: Immunoassay Classification"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "The very first recombinant biopharmaceutical therapeutic agent approved for clinical human administration by the US Food and Drug Administration (FDA) in 1982 was:", "opts": ["Recombinant Human Erythropoietin (Epogen)", "Recombinant Human Growth Hormone (Somatropin)", "Recombinant Human Insulin (Humulin)", "Recombinant Alpha-Interferon (Intron A)"], "ans": 2, "exp": "Humulin (recombinant human insulin), developed by Genentech and licensed to Eli Lilly, was produced in recombinant Escherichia coli and approved by the FDA in October 1982, marking the dawn of the commercial biopharmaceutical industry.<br>📚 <b>Ref:</b> Lecture 01 & 04: Introduction to Biotechnology (Historic Milestones - Humulin 1982)<br>⚠️ <b>Exam Trap:</b> Humulin (1982) was the first. Human growth hormone was approved later (1985).", "ar": "سؤال متوقع من نمط الدكتور: History of Biotechnology"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "During post-transcriptional processing of eukaryotic nuclear pre-mRNA, the molecular process of splicing involves:", "opts": ["Enzymatic excision of coding exons and covalent splicing of non-coding introns.", "Precise excision of non-coding introns and covalent ligation of coding exons to yield mature mRNA.", "Addition of a polyadenylic acid (poly-A) tail to the 5' triphosphate terminus.", "Chemical modification of cytosines to uracils via hydrolytic deamination."], "ans": 1, "exp": "Eukaryotic pre-mRNA transcripts contain intervening non-coding regions (introns) and expressed coding sequences (exons). The spliceosome performs two transesterification reactions that excise introns as lariats and covalently join exons together to produce mature translatable mRNA.<br>📚 <b>Ref:</b> Lecture 03: Protein Biosynthesis (Pre-mRNA Processing & Splicing)<br>⚠️ <b>Exam Trap:</b> Remember: INtrons stay IN the nucleus (excised); EXons are EXpressed (retained).", "ar": "سؤال متوقع من نمط الدكتور: Eukaryotic Gene Expression & Splicing"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "At an active DNA replication fork, the leading strand is synthesized:", "opts": ["Discontinuously away from the replication fork in the 3' to 5' direction.", "Continuously toward the advancing replication fork in the strict 5' to 3' direction.", "Without requiring any de novo primer synthesis by DNA primase.", "Exclusively by the enzyme DNA Ligase."], "ans": 1, "exp": "All DNA polymerases strictly synthesize DNA in the 5' to 3' direction by adding dNTPs to a free 3'-OH group. Because DNA strands are antiparallel, the leading strand template (running 3' to 5' toward the fork) allows continuous 5' to 3' synthesis toward the moving fork. The lagging strand must be synthesized discontinuously away from the fork as Okazaki fragments.<br>📚 <b>Ref:</b> Lecture 01: DNA Structure & Replication (Replication Fork Dynamics)<br>⚠️ <b>Exam Trap:</b> Synthesis ALWAYS occurs in the 5' -> 3' direction. Leading = continuous; Lagging = discontinuous.", "ar": "سؤال متوقع من نمط الدكتور: DNA Replication Fork Polarity"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Monoclonal antibodies (mAbs) are clinically preferred over animal-derived polyclonal antisera for therapeutic and targeted diagnostic applications because mAbs:", "opts": ["Can form massive cross-linked precipitating immune lattices with multivalent antigens.", "Are highly monospecific for a single, precisely defined epitope and exhibit batch-to-batch homogeneity.", "Are completely synthetic chemical compounds produced without any biological cell lines.", "Naturally occur in human serum in large quantities without any antigenic challenge."], "ans": 1, "exp": "Polyclonal antisera represent a heterogeneous cocktail of antibodies produced by multiple B-cell clones against multiple epitopes, showing significant batch variation. Monoclonal antibodies originate from a single hybridoma clone, recognizing a single unique epitope with exquisite specificity and providing indefinite, reproducible manufacturing.<br>📚 <b>Ref:</b> Lecture 05: Monoclonal Antibodies (Slide 8-10: Advantages & Disadvantages)<br>⚠️ <b>Exam Trap:</b> mAbs recognize ONE epitope and cannot cross-link into precipitating networks like polyclonal sera.", "ar": "سؤال متوقع من نمط الدكتور: Monoclonal vs Polyclonal Antibodies"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "A cell or tissue culture medium is defined as a 'Synthetic' or 'Chemically Defined' medium if:", "opts": ["It incorporates complex, undefined biological extracts such as fetal bovine serum or yeast hydrolysate.", "All of its chemical constituents, organic nutrients, salts, and their exact molar concentrations are known precisely.", "It lacks all inorganic trace elements, carbohydrates, and amino acids.", "It is formulated without water or osmotic buffers."], "ans": 1, "exp": "In chemically defined (synthetic) media, every single ingredient is known in exact stoichiometric amounts, and no undefined biological fluids (serum, peptone, coconut water) are present. Natural or complex media, conversely, contain undefined components.<br>📚 <b>Ref:</b> Lecture 02 & Past Exams: Types of Culture Media<br>⚠️ <b>Exam Trap:</b> Defined / Synthetic = 100% known chemical composition. Natural / Complex = contains serum/extracts.", "ar": "سؤال متوقع من نمط الدكتور: Culture Media Definitions"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "In the classical cloning plasmid pBR322, inserting a foreign DNA fragment into the unique BamHI restriction cleavage site results in:", "opts": ["Inactivation of the ampicillin resistance gene (ampR), while retaining tetracycline resistance (tetR).", "Inactivation of the tetracycline resistance gene (tetR), while retaining ampicillin resistance (ampR).", "Simultaneous inactivation of both the ampR and tetR genes.", "Loss of the origin of replication (ori), rendering the plasmid non-replicative."], "ans": 1, "exp": "In pBR322, the BamHI and SalI sites are located inside the tetracycline resistance gene (tetR), whereas the PstI site is inside the ampicillin resistance gene (ampR). Inserting foreign DNA at the BamHI site causes insertional inactivation of tetR. Recombinants will grow on ampicillin plates, but fail to grow on tetracycline plates (replica plating).<br>📚 <b>Ref:</b> Lecture 04: Recombinant DNA (Slide 14-16: pBR322 Cloning & Selection)<br>⚠️ <b>Exam Trap:</b> BamHI cuts inside tetR -> Tetracycline sensitivity. PstI cuts inside ampR -> Ampicillin sensitivity.", "ar": "سؤال متوقع من نمط الدكتور: Insertional Inactivation in Vectors"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Reverse transcriptase, an indispensable tool enzyme in recombinant cDNA cloning, is biochemically defined as an:", "opts": ["DNA-dependent RNA polymerase.", "RNA-dependent DNA polymerase.", "RNA-dependent RNA replicase.", "DNA-independent endonuclease."], "ans": 1, "exp": "Reverse transcriptase (derived from retroviruses like AMV or M-MLV) reads a single-stranded RNA template (mRNA) and synthesizes a complementary DNA strand (cDNA); hence it is an RNA-dependent DNA polymerase.<br>📚 <b>Ref:</b> Lecture 04: Recombinant DNA (cDNA Synthesis & Enzymes)<br>⚠️ <b>Exam Trap:</b> Reads RNA, synthesizes DNA = RNA-dependent DNA polymerase.", "ar": "سؤال متوقع من نمط الدكتور: Reverse Transcriptase Enzymology"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "In plant tissue culture, manipulating the hormonal ratio of Auxin to Cytokinin controls organogenesis. To induce root formation (rhizogenesis) from tobacco callus cultures, the medium must contain:", "opts": ["A high Auxin to Cytokinin ratio.", "A high Cytokinin to Auxin ratio.", "High Gibberellic acid in the complete absence of Auxin.", "Equal, neutral concentrations of Abscisic acid and Cytokinin."], "ans": 0, "exp": "In Skoog and Miller's classical hormonal balance model: A high Auxin:Cytokinin ratio promotes root differentiation (rhizogenesis); a high Cytokinin:Auxin ratio promotes shoot differentiation (caulogenesis); while intermediate/balanced ratios promote continued undifferentiated callus growth.<br>📚 <b>Ref:</b> Lecture 02: Plant Tissue Culture (Hormonal Regulation of Organogenesis)<br>⚠️ <b>Exam Trap:</b> High Auxin = Roots. High Cytokinin = Shoots. Balanced = Callus.", "ar": "سؤال متوقع من نمط الدكتور: Plant Growth Regulators & Morphogenesis"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "As the replication fork progresses, topological overwinding and positive superhelical tension accumulate ahead of the fork. This torsional strain is relieved by:", "opts": ["DNA Helicase breaking single strands.", "Single-Stranded DNA-Binding Proteins (SSBs).", "DNA Topoisomerase (DNA Gyrase in bacteria).", "RNA Primase initiating multiple primers."], "ans": 2, "exp": "Unwinding of the parental DNA duplex by helicase introduces severe topological torsional stress (positive supercoiling) downstream. Type I and Type II DNA Topoisomerases (such as bacterial DNA Gyrase) introduce transient single- or double-strand breaks, allowing rotation to relieve torsional strain before resealing the phosphodiester backbone.<br>📚 <b>Ref:</b> Lecture 01: DNA Structure & Replication (Topoisomerase / Gyrase Action)<br>⚠️ <b>Exam Trap:</b> Helicase unwinds strands; Topoisomerase / Gyrase relieves supercoiling tension.", "ar": "سؤال متوقع من نمط الدكتور: DNA Topology & Supercoiling"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] Hybridoma cell lines have a finite biological lifespan of three years in cell culture and cannot proliferate indefinitely.", "opts": ["True", "False"], "ans": 1, "exp": "Hybridoma cells are immortal cell lines. By fusing with neoplastic myeloma cells, they acquire indefinite, continuous proliferative capacity in vitro and in liquid nitrogen storage.<br>📚 <b>Ref:</b> Lecture 05: Monoclonal Antibodies (Slide 6 & Slide 14: Immortality of Hybridomas)", "ar": "صح أم خطأ: Hybridoma Lifespan"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] In a non-competitive sandwich ELISA, the intensity of the enzymatic chromogenic signal is inversely proportional to the concentration of antigen present in the sample.", "opts": ["True", "False"], "ans": 1, "exp": "In non-competitive sandwich ELISA, the signal is directly proportional to antigen concentration. Higher antigen levels capture more enzyme-labelled detection antibodies, producing a stronger signal.<br>📚 <b>Ref:</b> Lecture 05: Immunoassay Principles (Sandwich vs Competitive ELISA)", "ar": "صح أم خطأ: Sandwich ELISA Proportionality"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] Eukaryotic mammalian tumor cells in cell culture duplicate significantly faster than bacterial cells such as Escherichia coli.", "opts": ["True", "False"], "ans": 1, "exp": "Bacterial cells divide much faster than mammalian tumor cells. E. coli has a doubling time of approximately 20-30 minutes, whereas rapidly proliferating mammalian tumor cells take 18-24 hours per division cycle.<br>📚 <b>Ref:</b> Lecture 01 & Past Exams: Bacterial vs Eukaryotic Growth Rates", "ar": "صح أم خطأ: Cell Growth Kinetics"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] ELISA methodology can be configured to detect and quantify both target antigens and specific antibodies in patient clinical specimens.", "opts": ["True", "False"], "ans": 0, "exp": "True. Direct and Sandwich ELISA quantify antigens (e.g., viral antigens, hormones), whereas Indirect ELISA quantifies antibodies (e.g., anti-HIV, anti-SARS-CoV-2 antibodies).<br>📚 <b>Ref:</b> Lecture 05: Immunoassays (Applications of Direct, Indirect, and Sandwich ELISA)", "ar": "صح أم خطأ: ELISA Diagnostic Versatility"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] Aminopterin in HAT selective medium enables myeloma cells to survive by selectively stimulating the hypoxanthine salvage pathway.", "opts": ["True", "False"], "ans": 1, "exp": "Aminopterin acts as an antagonist that blocks the de novo nucleotide synthesis pathway. Myeloma cells die in HAT medium because they are genetically deficient in HGPRT and cannot utilize the hypoxanthine salvage pathway.<br>📚 <b>Ref:</b> Lecture 05: Monoclonal Antibodies (Slide 17: HAT Selection)", "ar": "صح أم خطأ: HAT Selection Chemistry"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] A functional plasmid cloning vector must contain an origin of replication (ori), at least one selectable marker gene, and a multiple cloning site (MCS).", "opts": ["True", "False"], "ans": 0, "exp": "True. The ori allows autonomous replication; the selectable marker (e.g., antibiotic resistance) allows selection of transformants; and the MCS provides unique restriction sites for foreign DNA insertion.<br>📚 <b>Ref:</b> Lecture 04: Recombinant DNA (Slide 11-13: Essential Vector Characteristics)", "ar": "صح أم خطأ: Cloning Vector Anatomy"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] Southern blotting is the analytical technique utilized to detect specific protein antigens immobilized on membranes using labeled monoclonal antibodies.", "opts": ["True", "False"], "ans": 1, "exp": "Southern blotting detects specific DNA sequences using nucleic acid probes. Western blotting (immunoblotting) detects specific proteins using labeled antibodies.<br>📚 <b>Ref:</b> Lecture 04: Recombinant DNA (Southern vs Western Blotting)", "ar": "صح أم خطأ: Southern Blotting Targets"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] DNA Polymerase III requires a pre-existing free 3'-OH terminus provided by an RNA primer to initiate nucleotide chain elongation.", "opts": ["True", "False"], "ans": 0, "exp": "True. Unlike RNA polymerases, DNA polymerases cannot synthesize DNA de novo and strictly require a free 3'-hydroxyl group onto which they can attach the incoming 5'-phosphate of a dNTP.<br>📚 <b>Ref:</b> Lecture 01: DNA Replication (Primer Requirement of DNA Polymerase)", "ar": "صح أم خطأ: DNA Polymerase Requirements"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] Recombinant Tissue Plasminogen Activator (tPA) functions directly as a blood clotting coagulation factor to halt massive hemorrhages.", "opts": ["True", "False"], "ans": 1, "exp": "tPA is a thrombolytic/fibrinolytic drug, NOT a clotting factor. It catalyzes the conversion of plasminogen into plasmin, which degrades fibrin and dissolves intravascular blood clots in acute ischemic stroke and myocardial infarction.<br>📚 <b>Ref:</b> Lecture 04 & Past Exams: Therapeutic Recombinant Proteins (tPA Action)", "ar": "صح أم خطأ: tPA Pharmacology"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] Degeneracy of the genetic code indicates that a single specific codon can code for several entirely different amino acids.", "opts": ["True", "False"], "ans": 1, "exp": "Degeneracy means that a single amino acid can be specified by multiple different synonymous codons (e.g., Leucine is encoded by 6 different codons). The code is unambiguous: each codon specifies only one amino acid.<br>📚 <b>Ref:</b> Lecture 03: Protein Biosynthesis (The Genetic Code: Degenerate vs Unambiguous)", "ar": "صح أم خطأ: Genetic Code Degeneracy"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] Effective cellular cryoprotectants like DMSO must be freely membrane-permeant, non-toxic at working concentrations, and capable of reducing intracellular ice crystallization.", "opts": ["True", "False"], "ans": 0, "exp": "True. Membrane-permeating cryoprotectants replace intracellular water, reduce eutectic temperatures, and physically impede the nucleation of sharp ice crystals.<br>📚 <b>Ref:</b> Lecture 05: Monoclonal Antibodies (Slide 21: Cryoprotectants)", "ar": "صح أم خطأ: Cryoprotectant Properties"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] Escherichia coli host expression systems can execute complex human post-translational modifications, including authentic N-linked core glycosylation.", "opts": ["True", "False"], "ans": 1, "exp": "E. coli lacks the endoplasmic reticulum and Golgi glycosylation enzymes required for complex human N- and O-linked glycosylation. Mammalian cell hosts (e.g., CHO cells) must be used for glycosylated therapeutic proteins.<br>📚 <b>Ref:</b> Lecture 04 & 05: Host Cell Expression Systems & Limitations", "ar": "صح أم خطأ: Bacterial Post-Translational Limitations"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] Plant cell totipotency refers to the innate capacity of an individual living, nucleated somatic plant cell to regenerate into an entire, mature, fertile organism.", "opts": ["True", "False"], "ans": 0, "exp": "True. Totipotency is the fundamental biological postulate enabling plant tissue culture, micropropagation, and genetic transformation.<br>📚 <b>Ref:</b> Lecture 02: Plant Biotechnology (Cellular Totipotency)", "ar": "صح أم خطأ: Plant Totipotency"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] During a standard PCR amplification cycle, the primer annealing temperature must be maintained higher than the catalytic extension temperature of Taq polymerase.", "opts": ["True", "False"], "ans": 1, "exp": "The annealing temperature is lower (50-65°C) than the extension temperature (72°C). High annealing temperatures above 72°C would prevent primers from stably hybridizing to target DNA.<br>📚 <b>Ref:</b> Lecture 02: Polymerase Chain Reaction (Slide 7-9: Temperature Optimization)", "ar": "صح أم خطأ: PCR Temperature Profiles"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "[True / False] Autoradiography is an imaging modality that employs photosensitive X-ray film to localize radioactive isotopes (e.g., 32P or 35S) immobilized within blotted membranes or polyacrylamide gels.", "opts": ["True", "False"], "ans": 0, "exp": "True. Radioactive emissions from beta particles expose silver halide crystals on the overlying X-ray film, generating permanent visual black bands at the radioactive locations.<br>📚 <b>Ref:</b> Lecture 01 & 04: Blotting & Detection Modalities (Autoradiography)", "ar": "صح أم خطأ: Autoradiography Detection"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Antibodies belong to which class of biomolecules, and which cells synthesize them (Slide 2)?", "opts": ["Lipoproteins synthesized by cytotoxic T-cells", "Glycoproteins synthesized and secreted by B-lymphocytes", "Fibrous proteins produced by splenic reticular cells", "Phosphoproteins synthesized by macrophages"], "ans": 0, "exp": "Slide 2 explicitly defines antibodies: 'Antibodies, or immunoglobulins are a group of glycoproteins produced by B-lymphocytes in response to antigens.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Why is an antiserum harvested from an animal challenged with an antigen considered heterogeneous (Slide 4)?", "opts": ["Because antibodies mutate within the bloodstream after secretion", "Because it contains diverse antibodies from multiple B-cell clones responding to different epitopes, plus past irrelevant antibodies", "Because it consists entirely of non-immunoglobulin serum albumins", "Because the spleen degrades the antigen into non-immunogenic fragments"], "ans": 0, "exp": "Slide 4 states that serum antibodies consist of immunoglobulins produced by a range of B lymphocytes responding to different epitopes, combined with antibodies produced to past irrelevant challenges.", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "In 1975, Köhler and Milstein achieved a revolutionary breakthrough by fusing (Slide 6):", "opts": ["A human T-lymphocyte with a mouse sarcoma cell", "An antibody-producing mouse spleen B-lymphocyte with a myeloma cell from the same strain", "A macrophage with an erythrocyte in the presence of Sendai virus", "A plasma cell with an embryonic stem cell"], "ans": 0, "exp": "Slide 6 verbatim: 'In 1975 Kohler and Milstein successfully fused antibody-producing B lymphocyte from a mouse spleen to a myeloma cell line from the same strain.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Which of the following represents an inherent disadvantage of monoclonal antibodies compared to polyclonal antibodies (Slide 10)?", "opts": ["MAbs have shorter half-lives in frozen storage", "MAbs are unable to form precipitating lattice networks with antigen because they bind only a single epitope", "MAbs can only recognize carbohydrate antigens, not proteins", "MAbs cannot be purified by affinity chromatography"], "ans": 0, "exp": "Slide 10 states: 'Mabs, opposite to polyclonal Abs, cannot form network between Ab and antigen and so unlikely to form precipitating complexes.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "A diagnostic assay utilizing a MAb against a viral coat protein may fail when testing clinical samples because (Slide 10):", "opts": ["The antibody degrades rapidly upon contact with virus particles", "The MAb may be so specific that it fails to cross-react with minor mutant strains of the same virus", "Monoclonal antibodies only bind denatured viral proteins on Western blots", "The virus produces anti-MAb proteases immediately"], "ans": 0, "exp": "Slide 10 highlights: 'Mabs to viral strains may be so specific that they do not cross-react with other minor strains of the same virus.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Under what circumstance will a monoclonal antibody be unable to distinguish between two completely different antigens (Slide 10)?", "opts": ["If the two antigens have identical molecular weights", "If the MAb is directed against an epitope that is common to both antigens", "If both antigens are glycoproteins synthesized in mammalian cells", "If the test is performed at physiological pH"], "ans": 0, "exp": "Slide 10 explicitly notes: 'Cannot discriminate between two antigens if the antibody is directed to an epitope common to the two antigens.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Polyethylene Glycol (PEG, MW 600–6000 Da) acts as a chemical fusogen by which physical mechanism (Slide 15)?", "opts": ["Hydrolyzing membrane phospholipids into lysophospholipids", "Acting via dehydration, removing water molecules from the medium and forcing cells into intimate contact", "Binding to cell-surface integrins to trigger endocytosis", "Generating electrical voltage pulses across the membrane"], "ans": 0, "exp": "Slide 15 states: 'Polyethylene glycol (PEG). MWT 600-6000. Works by dehydration, removing water molecules from the medium and forcing cells into intimate contact.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "How does electrofusion induce cell membrane coalescing during hybridoma production (Slide 15)?", "opts": ["By applying heat to denature transmembrane proteins", "By delivering a microsecond voltage pulse that causes reversible breakdown of membrane contact areas, developing micropores", "By inducing Sendai viral envelope proteins to activate", "By creating osmotic swelling through sucrose influx"], "ans": 0, "exp": "Slide 15 states: 'Electrofusion: a voltage pulse for microseconds. Causes reversible breakdown of the area of membrane contact, developing pores.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "How does Sendai virus induce somatic cell fusion in hybridoma protocols (Slide 15)?", "opts": ["It injects DNA ligase into both cells", "It possesses an envelope that promotes cell-cell fusion by an envelope-mediated mechanism", "It acts as a chemical dehydrating agent similar to PEG", "It digests cell membranes with neuraminidase exclusively"], "ans": 0, "exp": "Slide 15 states: 'By the addition of certain viruses (Sendai virus). The virus has an envelope that promotes fusion by an unexplained mechanism.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Which component of HAT medium serves as the metabolic poison, and which pathway does it block (Slide 17, 20)?", "opts": ["Hypoxanthine, which blocks the salvage pathway of nucleotide synthesis", "Aminopterin, which blocks the de novo pathway of nucleic acid biosynthesis", "Thymidine, which inhibits DNA polymerase directly", "Polyethylene glycol, which blocks glucose transport"], "ans": 0, "exp": "Slide 17 and 20 explain that Aminopterin is added to kill unfused myeloma cells by blocking the de novo nucleotide synthesis pathway.", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Why do unfused myeloma cells perish when cultured in HAT selection medium (Slide 17)?", "opts": ["They are killed by antibodies secreted by splenic B-cells", "They are genetically engineered such that they cannot use the salvage pathway (HGPRT-) and their de novo pathway is blocked by Aminopterin", "They lack receptors for thymidine uptake", "They undergo spontaneous apoptosis due to lack of growth factors"], "ans": 0, "exp": "Slide 17 notes: 'Myeloma cells have been genetically engineered such that they can not use hypoxanthine, aminopterin, and thymidine (HAT medium) as a source for nucleic acid biosynthesis and will die in culture.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "What mechanism is responsible for clearing unfused primary spleen B-lymphocytes from culture (Slide 16, 20)?", "opts": ["They are selectively lysed by Aminopterin", "They are primary differentiated somatic cells with a finite lifespan that die naturally in culture within days", "They are phagocytosed by surviving myeloma cells", "They require high concentrations of PEG to remain viable"], "ans": 0, "exp": "Slide 16 and 20 state: 'B cells die rapidly in culture' (Step 4: 'Allow unfused B cells to die naturally').", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Why do hybridoma cells successfully survive and proliferate in HAT medium (Slide 17)?", "opts": ["They degrade Aminopterin using an enzyme from the myeloma parent", "They utilize the salvage pathway using functional HGPRT inherited from the B-cell and immortality from the myeloma", "They switch their metabolism entirely to amino acid fermentation", "They lack cell membranes, making them impervious to Aminopterin"], "ans": 0, "exp": "Slide 17 states: 'Only B cells that have fused with the engineered myeloma cells will survive in culture when grown in HAT medium' because they inherit functional salvage enzymes from the B-cell.", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Why must hybridomas be screened and cloned promptly after the fusion procedure (Slide 18)?", "opts": ["Because the culture medium evaporates within 48 hours", "Because early post-fusion cells undergo random chromosome sorting and loss, which can cause loss of antibody genes", "Because hybridomas convert into myeloma cells if not cloned immediately", "Because secreted antibodies inhibit hybridoma cell division"], "ans": 0, "exp": "Slide 18 states: 'In the early postfusion stage, fused cells undergo a random sorting and loss of chromosomes, acquiring a greater proportion of energy to live, so some may loose the functional genes coding for MABs.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Where are secreted monoclonal antibodies detected during hybridoma screening, and what is the most convenient method (Slide 19)?", "opts": ["Inside the cell nucleus; detected by Southern blotting", "In the cell culture supernatant; detected most conveniently by ELISA", "Bound to cell membrane lipids; detected by Gram staining", "In the cell pellet lysate; detected by PCR"], "ans": 0, "exp": "Slide 19 explicitly states: 'The presence of the antibody is detected in the supernatant of the lamanders create glycerol in their livers for use as cryoprotectant.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "In vivo MAb production involves propagating hybridoma cells in which anatomical compartment (Slide 22)?", "opts": ["Subcutaneous connective tissue of rabbits", "The peritoneal cavity (peritonea) of mice or rats, harvesting antibodies from ascitic fluid", "The cerebral spinal fluid of sheep", "Avian egg chorioallantoic membranes"], "ans": 0, "exp": "Slide 22 explicitly states: 'In Vivo Production: By propagating the cells in the peritonea of mice or rats. The MABs accumulates in the ascitic fluid.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Why are monoclonal antibodies harvested from mouse ascitic fluid prohibited for human clinical therapeutics (Slide 22)?", "opts": ["Because ascitic antibodies have zero affinity for human antigens", "Due to ethical concerns, animal death, contamination with rodent pathogens, and risk of severe human immune reactions", "Because ascitic fluid does not contain immunoglobulins", "Because ascitic fluid cannot be frozen at -196°C"], "ans": 0, "exp": "Slide 22 lists major problems of in vivo ascites: 'ethical, variability, death of animals, contamination, not suitable for therapeutic application.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "What is a major advantage of large-scale in vitro mammalian cell culture (e.g., 50,000 L bioreactors) for MAb manufacturing (Slide 23)?", "opts": ["It requires zero capital cost and needs no sterile media", "Cell growth doubling time is faster than bacterial doubling times", "Well-understood technology where the authentic pattern of MAb assembly and glycosylation is preserved", "Cells can grow indefinitely without nutrients or oxygen"], "ans": 0, "exp": "Slide 23 states: 'Mammalian cells have well understood technology, pattern of MAB assembly is likely to be preserved' and can be grown in large cultures up to 50,000 L.", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Which of the following in vivo therapeutic applications of monoclonal antibodies is explicitly listed in Slide 8?", "opts": ["In vivo neutralization of toxins, hormones, and drugs", "Direct gene editing of mutated host DNA", "Stimulation of bacterial cell wall synthesis", "Reversing chromosome loss during cell division"], "ans": 0, "exp": "Slide 8 lists: 'Use in vivo to neutralize toxins, hormones, drugs.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Reviewing the 10 practical steps in MAb production (Slide 20), what immediately follows adding Aminopterin to eliminate unfused myelomas?", "opts": ["Harvesting antibody from peritoneal ascites", "Cloning remaining cells (placing 1 cell/well to grow clones)", "Injecting booster antigen doses into the mouse", "Treating cells with Sendai virus a second time"], "ans": 0, "exp": "Slide 20 lists Step 5: 'Add aminopterin to culture to kill unfused myeloma cells' immediately followed by Step 6: 'Clone remaining cells (place 1 cell/well and allow each cell to grow into a clone of cells)'.", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "According to lecture Slide 20, what commercial price range per milligram is typically charged by biotech companies for purified MAbs?", "opts": ["$1 to $2 per mg", "$10 to $20 per mg", "$1,000 to $2,000 per mg", "$50,000 per mg"], "ans": 0, "exp": "Slide 20 humorous yet factual step 10 states: '(If you’re a biotech company) charge about $1,000-$2,000 per mg.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}, {"m": "expected", "isExpected": true, "isPast": false, "q": "Which of the following chemical agents are considered conventional laboratory cryoprotectants according to Slide 21?", "opts": ["Ethylene glycol, Glycerol, and Dimethyl sulphoxide (DMSO)", "Methanol, Ethanol, and Isopropanol", "Formaldehyde, Acetone, and Chloroform", "Hydrochloric acid and Sodium dodecyl sulfate"], "ans": 0, "exp": "Slide 21 explicitly lists: 'Conventional cryoprotectants are glycols such as ethylene glycol, and glycerol... Dimethyl sulphoxide (DMSO) is also regarded as a conventional cryoprotectant.'", "ar": "سؤال متوقع في الأجسام المضادة وتقنية الهيبريدوما"}]};

let currentTab = 'quiz';
let quizSource = 'expected';
let quizMode = 'study';
let quizAnswers = {};
let mistakesOnly = false;

// Modules filter state
let selectedMod = 'all';

// Cheatsheet sub-section state
let subSection = 'all';

// Flashcards state
let fcIdx = 0;
let fcFlipped = false;
let fcList = DATA.flashcards;

function switchTab(tab) {
  currentTab = tab;
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === tab);
  });
  document.querySelectorAll('.tab-content').forEach(el => {
    el.style.display = (el.id === 'tab-' + tab) ? 'block' : 'none';
  });
  if (tab === 'quiz') renderQuiz();
  if (tab === 'panic') renderPanic();
  if (tab === 'scientists') renderScientistsAndMath();
  if (tab === 'modules') renderModules();
  if (tab === 'flashcards') renderFlashcard();
  window.scrollTo({ top: 0, behavior: 'instant' });
}

// ==================== 1. QUIZ LOGIC ====================
function setQuizSource(src) {
  quizSource = src;
  mistakesOnly = false;
  renderQuiz();
}

function setQuizMode(mode) {
  quizMode = mode;
  document.getElementById('btn-mode-study').classList.toggle('active', mode === 'study');
  document.getElementById('btn-mode-test').classList.toggle('active', mode === 'test');
  renderQuiz();
}

function toggleMistakesOnly() {
  mistakesOnly = !mistakesOnly;
  renderQuiz();
}

function answerQuestion(qIdx, optIdx) {
  quizAnswers[qIdx] = optIdx;
  renderQuiz();
}

function renderQuiz() {
  const container = document.getElementById('quiz-items');
  const allIndexed = DATA.quiz.map((q, idx) => ({ ...q, idx }));
  
  const mockCount = allIndexed.filter(q => q.isExpected).length;
  const pastCount = allIndexed.filter(q => q.isPast).length;
  const simCount = allIndexed.filter(q => !q.isPast && !q.isExpected).length;
  const wrongCount = allIndexed.filter(q => quizAnswers[q.idx] !== undefined && quizAnswers[q.idx] !== q.ans).length;

  document.getElementById('quiz-chips').innerHTML = `
    <button class="chip ${quizSource === 'expected' && !mistakesOnly ? 'active' : ''}" onclick="setQuizSource('expected')">🎯 Mock Exam (${mockCount})</button>
    <button class="chip ${quizSource === 'past' && !mistakesOnly ? 'active' : ''}" onclick="setQuizSource('past')">🔥 Past Exams (${pastCount})</button>
    <button class="chip ${quizSource === 'sim' && !mistakesOnly ? 'active' : ''}" onclick="setQuizSource('sim')">⚡ Simulations (${simCount})</button>
    <button class="chip ${quizSource === 'all' && !mistakesOnly ? 'active' : ''}" onclick="setQuizSource('all')">All (${allIndexed.length})</button>
    <button class="chip ${mistakesOnly ? 'active' : ''}" onclick="toggleMistakesOnly()">❌ Mistakes Only (${wrongCount})</button>
  `;

  let list = allIndexed;
  if (mistakesOnly) {
    list = list.filter(q => quizAnswers[q.idx] !== undefined && quizAnswers[q.idx] !== q.ans);
  } else if (quizSource === 'expected') {
    list = list.filter(q => q.isExpected);
  } else if (quizSource === 'past') {
    list = list.filter(q => q.isPast);
  } else if (quizSource === 'sim') {
    list = list.filter(q => !q.isPast && !q.isExpected);
  }

  if (list.length === 0) {
    container.innerHTML = `<div class="empty-notice">${mistakesOnly ? '🎉 Zero mistakes! You have not gotten any questions wrong so far!' : 'No questions in this filter.'}</div>`;
    return;
  }

  const letters = ['A', 'B', 'C', 'D', 'E'];
  let html = '';

  list.forEach((item, pos) => {
    const isMock = item.isExpected;
    const isPast = item.isPast;
    let badgeClass = isMock ? 'badge-mock' : (isPast ? 'badge-past' : 'badge-sim');
    let badgeLabel = isMock ? 'Mock Exam' : (isPast ? 'Past Exam' : 'Simulation');

    const chosen = quizAnswers[item.idx];
    const isAnswered = chosen !== undefined;
    const isStudyMode = (quizMode === 'study');

    html += `
      <div class="q-card" id="q-${item.idx}">
        <div class="q-header">
          <span class="q-badge ${badgeClass}">${badgeLabel}</span>
          <span class="q-number">Q ${pos + 1} of ${list.length}</span>
        </div>
        <div class="q-text">${item.q}</div>
        ${item.ar ? `<div class="ar-box" dir="rtl">${item.ar}</div>` : ''}
        
        <div class="q-options">
    `;

    item.opts.forEach((opt, oIdx) => {
      const isCorrectOption = (oIdx === item.ans);
      let optClass = 'opt-btn';

      if (isStudyMode) {
        if (isCorrectOption) optClass += ' opt-correct';
        else optClass += ' opt-dim';
      } else if (isAnswered) {
        if (isCorrectOption) optClass += ' opt-correct';
        else if (oIdx === chosen) optClass += ' opt-wrong';
        else optClass += ' opt-dim';
      }

      html += `
        <button class="${optClass}" onclick="${isStudyMode ? '' : `answerQuestion(${item.idx}, ${oIdx})`}">
          <span class="opt-key">${letters[oIdx] || oIdx + 1}</span>
          <span>${opt}</span>
        </button>
      `;
    });

    html += `</div>`;

    if (isStudyMode || isAnswered) {
      const isOk = (chosen === item.ans);
      let feedbackClass = isStudyMode ? 'correct' : (isOk ? 'correct' : 'wrong');
      let statusPrefix = isStudyMode 
        ? `<b>✔ Correct: Option ${letters[item.ans]}</b>` 
        : (isOk ? `<b>✔ Correct!</b>` : `<b>✖ Wrong — Correct Answer is ${letters[item.ans]}:</b>`);

      html += `
        <div class="q-feedback ${feedbackClass}">
          <div>${statusPrefix} ${item.exp || ''}</div>
        </div>
      `;
    }

    html += `</div>`;
  });

  container.innerHTML = html;
}

// ==================== 2. MODULES (WITH TABLES, PIPELINES & MNEMONICS) ====================
function setModFilter(mId) {
  selectedMod = mId;
  renderModules();
}

function renderModules() {
  const chipsContainer = document.getElementById('module-chips');
  let chipsHtml = `<button class="chip ${selectedMod === 'all' ? 'active' : ''}" onclick="setModFilter('all')">All 6 Modules</button>`;
  DATA.modules.forEach(m => {
    chipsHtml += `<button class="chip ${selectedMod === m.id ? 'active' : ''}" onclick="setModFilter('${m.id}')">M${m.num}: ${m.title.split('—')[0].split('&')[0].trim()}</button>`;
  });
  chipsContainer.innerHTML = chipsHtml;

  const container = document.getElementById('modules-items');
  let html = '';

  DATA.modules.forEach(m => {
    if (selectedMod !== 'all' && selectedMod !== m.id) return;

    html += `
      <div class="module-header">
        <div class="module-num">Module ${m.num} • ${m.slides} • Est. ${m.estTime}</div>
        <div class="module-title">${m.title}</div>
        <div style="font-size:12px; color:#cbd5e1; margin-top:2px;">${m.subtitle}</div>
        ${m.arSummary ? `<div class="ar-box ar-box-green" dir="rtl" style="margin-top:6px;">💡 ملخص الموديول: ${m.arSummary}</div>` : ''}
      </div>
    `;

    m.cards.forEach(c => {
      html += `
        <div class="note-card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
            <div class="note-title">${c.title}</div>
            ${c.badge ? `<span class="q-badge badge-sim">${c.badge}</span>` : ''}
          </div>
      `;

      // 1. Points
      if (c.points && c.points.length) {
        html += `<ul class="note-bullets">${c.points.map(p => `<li>${p}</li>`).join('')}</ul>`;
      }

      // 2. Step-by-Step Pipeline
      if (c.pipeline && c.pipeline.length) {
        html += `<div class="pipe-list">`;
        c.pipeline.forEach(st => {
          html += `
            <div class="pipe-box">
              <div class="pipe-top">
                <span class="pipe-idx">${st.step}</span>
                <span class="pipe-actor">${st.actor}</span>
              </div>
              <div class="pipe-desc">${st.desc}</div>
            </div>
          `;
        });
        html += `</div>`;
      }

      // 3. Comparison Table
      if (c.table) {
        html += `
          <div class="table-container">
            <table class="clean-table">
              <thead><tr>${c.table.headers.map(h => `<th>${h}</th>`).join('')}</tr></thead>
              <tbody>
                ${c.table.rows.map(r => `<tr>${r.map(cell => `<td>${cell}</td>`).join('')}</tr>`).join('')}
              </tbody>
            </table>
          </div>
        `;
      }

      // 4. Points After Table
      if (c.pointsAfter && c.pointsAfter.length) {
        html += `<ul class="note-bullets" style="margin-top:6px;">${c.pointsAfter.map(p => `<li>${p}</li>`).join('')}</ul>`;
      }

      // 5. Mnemonic
      if (c.mnemonic) {
        html += `<div class="mnemonic-tag">🧠 Mnemonic: ${c.mnemonic}</div>`;
      }

      // 6. Exam Trap
      if (c.trap) {
        html += `<div class="trap-tag">⚠️ Trap: ${c.trap}</div>`;
      }

      // 7. Arabic Note
      if (c.ar) {
        html += `<div class="ar-box" dir="rtl">💡 ${c.ar}</div>`;
      }

      html += `</div>`;
    });
  });

  container.innerHTML = html;
}

// ==================== 3. SCIENTISTS, FORMULAS, NUMBERS & ENZYMES ====================
function setSubSection(sec) {
  subSection = sec;
  renderScientistsAndMath();
}

function renderScientistsAndMath() {
  document.getElementById('cheat-chips').innerHTML = `
    <button class="chip ${subSection === 'all' ? 'active' : ''}" onclick="setSubSection('all')">All Sections</button>

    <button class="chip ${subSection === 'numbers' ? 'active' : ''}" onclick="setSubSection('numbers')">⚡ Golden Numbers (${DATA.numbers.length})</button>

  `;

  let html = '';

  // 1. Scientists
  if (subSection === 'all' || subSection === 'scientists') {
    html += `
      <div class="module-header" style="margin-top:0;">
        <div class="module-title">🔬 Chronological Scientists & Nobel Prizes (جدول العلماء والتواريخ ونوبل)</div>
      </div>
      <div class="table-container">
        <table class="clean-table">
          <thead>
            <tr><th>Year</th><th>Scientist</th><th>Core Discovery</th><th>Doctor's Exam Trap</th></tr>
          </thead>
          <tbody>
    `;
    DATA.scientists.forEach(s => {
      html += `
        <tr>
          <td><span class="year-tag">${s.year}</span></td>

          </td>
          <td><span class="trap-tag">${s.examTrap}</span></td>
        </tr>
      `;
    });
    html += `</tbody></table></div>`;
  }

  // 2. Formulas
  if (subSection === 'all' || subSection === 'formulas') {
    html += `
      <div class="module-header" style="margin-top:14px;">
        <div class="module-title">📐 Math Formulas & Exact Calculations (المعادلات والنسب المئوية)</div>
      </div>
    `;
    DATA.formulas.forEach(f => {
      html += `
        <div class="formula-card">
          <div class="formula-name">${f.title} (${f.topic})</div>
          <div class="formula-eq">${f.formula}</div>
          <ul class="note-bullets">
            ${f.points.map(p => `<li>${p}</li>`).join('')}
          </ul>
          <div class="ar-box" dir="rtl" style="margin-bottom:0;">💡 ${f.ar}</div>
        </div>
      `;
    });
  }

  // 3. Golden Numbers
  if (subSection === 'all' || subSection === 'numbers') {
    html += `
      <div class="module-header" style="margin-top:14px;">
        <div class="module-title">⚡ Golden Numbers, Yields & Temperatures (الأرقام الذهبية والنسب)</div>
      </div>
      <div class="table-container">
        <table class="clean-table">
          <thead>
            <tr><th>Value / Number</th><th>Topic</th><th>Exact Exam Fact</th></tr>
          </thead>
          <tbody>
    `;
    DATA.numbers.forEach(n => {
      html += `
        <tr>
          <td><span class="year-tag">${n.num}</span></td>
          <td><b>${n.topic}</b></td>
          <td>
            ${n.fact}
            <div style="font-size:11.5px; color:#1e40af; margin-top:2px;" dir="rtl">💡 ${n.ar}</div>
          </td>
        </tr>
      `;
    });
    html += `</tbody></table></div>`;
  }

  // 4. Enzymes & Reagents
  if (subSection === 'all' || subSection === 'enzymes') {
    html += `
      <div class="module-header" style="margin-top:14px;">
        <div class="module-title">🧬 Master Enzymes, Vectors & Reagents Dictionary (الإنزيمات والكواشف)</div>
      </div>
      <div style="display:flex; flex-direction:column; gap:8px; margin-top:8px;">
    `;
    DATA.enzymes.forEach(e => {
      html += `
        <div class="note-card" style="border-radius:6px; border-top:1px solid var(--border);">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <span style="font-weight:700; color:var(--primary); font-size:13.5px;">${e.name}</span>
            <span class="year-tag">${e.cat}</span>
          </div>
          <div style="font-size:12.5px; color:#334155; margin-top:4px;">${e.role}</div>
          <div class="ar-box" dir="rtl" style="margin-top:4px; margin-bottom:0;">💡 ${e.ar}</div>

    });

  document.getElementById('cheat-items').innerHTML = html;
}

// ==================== 4. PANIC BLITZ ====================
function renderPanic() {
  const container = document.getElementById('panic-items');
  let html = '';
  DATA.panic.forEach((p, idx) => {
    html += `
      <div class="blitz-item">
        <div class="blitz-see">If question mentions: <b>${p.see}</b></div>
        <div class="blitz-pick">👉 Pick: ${p.pick}</div>
        <div class="ar-box ar-box-green" dir="rtl">💡 ${p.ar}</div>
      </div>
    `;

// ==================== 5. FLASHCARDS ====================
function renderFlashcard() {
  if (fcList.length === 0) return;
  const card = fcList[fcIdx];
  const container = document.getElementById('fc-box');
  document.getElementById('fc-counter').textContent = `Card ${fcIdx + 1} of ${fcList.length}`;
  
  container.innerHTML = `
    <div class="fc-type">${fcFlipped ? '✅ Correct Answer' : '❓ Question (Tap to reveal)'}</div>
    <div class="fc-text">${fcFlipped ? card.a : card.q}</div>
    ${fcFlipped && card.ar ? `<div class="ar-box" dir="rtl" style="margin-top:10px; width:100%;">💡 ${card.ar}</div>` : ''}
  `;
}

function flipFc() { fcFlipped = !fcFlipped; renderFlashcard(); }
function nextFc() { fcIdx = (fcIdx + 1) % fcList.length; fcFlipped = false; renderFlashcard(); }
function prevFc() { fcIdx = (fcIdx - 1 + fcList.length) % fcList.length; fcFlipped = false; renderFlashcard(); }

// Initialize on DOM ready
document.addEventListener('DOMContentLoaded', () => {
  switchTab('quiz');
});
